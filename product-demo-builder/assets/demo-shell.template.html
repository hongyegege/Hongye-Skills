<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#eef1f6" />
  <title>产品 Demo Builder · 离线交互模板</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #2f6bff;
      --brand-dark: #1e4dcc;
      --brand-soft: #eef3ff;
      --brand-rgb: 47, 107, 255;
      --ink: #20252b;
      --muted: #747c86;
      --line: #e3e7ed;
      --surface: #fff;
      --canvas: #f4f6f9;
      --danger: #de5b62;
      --success: #2b9f70;
      --shadow: 0 24px 70px rgba(25, 31, 43, .16);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; color: var(--ink); background: #edf0f5; }
    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 328px minmax(560px, 1fr); }
    .panel { position: sticky; top: 0; height: 100vh; overflow: auto; padding: 30px 26px 24px; border-right: 1px solid rgba(24, 31, 40, .08); background: rgba(255,255,255,.9); backdrop-filter: blur(22px); }
    .brand-head { display: flex; align-items: center; gap: 12px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .brand-mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; color: #fff; background: linear-gradient(145deg, var(--brand), var(--brand-dark)); font-weight: 800; letter-spacing: -.05em; box-shadow: 0 10px 24px rgba(var(--brand-rgb), .24); }
    .brand-head strong, .brand-head small { display: block; }
    .brand-head strong { font-size: 17px; }
    .brand-head small { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .control-group { margin-top: 22px; }
    .control-label { margin-bottom: 8px; color: #8a919a; font-size: 12px; font-weight: 650; letter-spacing: .03em; }
    .segmented, .control-grid, .state-grid { display: grid; gap: 6px; padding: 4px; border-radius: 12px; background: #eff1f4; }
    .segmented { grid-template-columns: 1fr 1fr; }
    .control-grid { grid-template-columns: 1fr 1fr; }
    .state-grid { grid-template-columns: 1fr 1fr; background: transparent; padding: 0; }
    .segmented button, .control-grid button { min-height: 38px; padding: 7px 5px; border: 0; border-radius: 9px; color: #69717a; background: transparent; cursor: pointer; font-size: 12px; }
    .segmented button.active, .control-grid button.active { color: var(--brand); background: #fff; font-weight: 700; box-shadow: 0 3px 12px rgba(22, 29, 40, .08); }
    .state-grid button { min-height: 38px; display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; color: #626a73; background: #fff; cursor: pointer; font-size: 12px; }
    .state-grid button.active { color: var(--brand); border-color: rgba(var(--brand-rgb), .5); background: var(--brand-soft); font-weight: 650; }
    .state-grid i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .select-wrap { position: relative; }
    .select-wrap select { width: 100%; height: 42px; appearance: none; padding: 0 36px 0 12px; border: 1px solid var(--line); border-radius: 10px; color: #4b535c; background: #fff; cursor: pointer; font-size: 12px; }
    .select-wrap::after { content: ""; position: absolute; top: 16px; right: 14px; width: 7px; height: 7px; border-right: 1px solid #737a83; border-bottom: 1px solid #737a83; transform: rotate(45deg); pointer-events: none; }
    .panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
    .panel-actions button { min-height: 42px; border: 0; border-radius: 11px; cursor: pointer; font-weight: 650; }
    .panel-actions .reset { color: #59616a; background: #eef0f3; }
    .panel-actions .primary { color: #fff; background: var(--brand); }
    .panel-tip { margin: 18px 1px 0; color: #969da6; font-size: 11px; line-height: 1.6; }
    .stage { min-height: 100vh; padding: 32px 5vw 28px; display: flex; flex-direction: column; align-items: center; }
    .stage-head { width: min(760px, 100%); display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    .stage-head small { display: block; margin-bottom: 5px; color: var(--brand); font-size: 10px; font-weight: 750; letter-spacing: .14em; }
    .stage-head h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
    .stage-badge { white-space: nowrap; padding: 8px 12px; border: 1px solid rgba(var(--brand-rgb), .16); border-radius: 99px; color: var(--brand); background: var(--brand-soft); font-size: 12px; font-weight: 650; }
    .phone-wrap { flex: 1; display: grid; place-items: center; min-height: 720px; }
    .phone { position: relative; width: 390px; height: 844px; padding: 9px; overflow: hidden; border-radius: 50px; background: #12151a; box-shadow: var(--shadow), inset 0 0 0 2px #2c3037; }
    .phone::before { content: ""; position: absolute; inset: 3px; z-index: 30; border: 1px solid rgba(255,255,255,.14); border-radius: 47px; pointer-events: none; }
    .speaker { position: absolute; z-index: 40; top: 17px; left: 50%; width: 104px; height: 28px; transform: translateX(-50%); border-radius: 16px; background: #080a0d; }
    .status-bar { position: absolute; z-index: 35; top: 9px; left: 9px; right: 9px; height: 48px; padding: 13px 22px 0; display: flex; justify-content: space-between; color: #15181c; font-size: 12px; font-weight: 700; pointer-events: none; }
    .status-icons { display: flex; align-items: center; gap: 7px; }
    .battery { width: 19px; height: 10px; position: relative; padding: 1px; border: 1px solid currentColor; border-radius: 3px; }
    .battery::after { content: ""; position: absolute; top: 2px; right: -3px; width: 2px; height: 4px; border-radius: 0 1px 1px 0; background: currentColor; }
    .battery i { display: block; width: 85%; height: 100%; border-radius: 1px; background: currentColor; }
    .app { position: absolute; inset: 9px; overflow: hidden; border-radius: 41px; background: var(--canvas); }
    .home-indicator { position: absolute; z-index: 40; bottom: 16px; left: 50%; width: 125px; height: 5px; transform: translateX(-50%); border-radius: 3px; background: #15181c; pointer-events: none; }
    .screen { min-height: 100%; display: flex; flex-direction: column; color: var(--ink); background: var(--canvas); animation: screen-in 160ms ease-out; }
    @keyframes screen-in { from { opacity: .5; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .nav { flex: 0 0 54px; height: 54px; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; border-bottom: 1px solid rgba(31, 38, 47, .04); background: rgba(255,255,255,.55); }
    .nav h2 { margin: 0; text-align: center; font-size: 17px; font-weight: 650; }
    .nav button { width: 44px; height: 44px; margin-left: 4px; border: 0; color: #616a74; background: transparent; cursor: pointer; font-size: 26px; line-height: 1; }
    .nav .nav-action { width: auto; margin: 0 7px 0 0; color: var(--brand); font-size: 12px; font-weight: 700; }
    .scroll { flex: 1; overflow: auto; }
    .share-page { min-height: 100%; padding: 16px 14px 32px; }
    .qr-card, .option-card, .list-card, .manage-card { border-radius: 14px; background: var(--surface); box-shadow: 0 7px 22px rgba(24, 31, 41, .05); }
    .qr-card { padding: 18px 16px 14px; text-align: center; }
    .qr-card h3 { margin: 0 0 13px; font-size: 16px; font-weight: 650; }
    .qr-stage { position: relative; width: 164px; height: 164px; margin: 0 auto; padding: 8px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1px #f0f1f3; }
    .qr-grid { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(21, 1fr); gap: 1px; }
    .qr-grid i { display: block; border-radius: 1px; background: transparent; }
    .qr-grid i.on { background: #111318; }
    .qr-overlay { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,.78); color: var(--brand); font-size: 12px; font-weight: 700; }
    .spinner { width: 22px; height: 22px; border: 2px solid rgba(var(--brand-rgb),.22); border-top-color: var(--brand); border-radius: 50%; animation: spin 800ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .qr-copy { margin-top: 11px; color: #5e6770; font-size: 13px; line-height: 1.5; }
    .qr-copy small { display: block; color: #9aa1a9; font-size: 11px; }
    .text-button { margin-top: 8px; border: 0; border-bottom: 1px solid currentColor; color: var(--brand); background: transparent; cursor: pointer; font-size: 12px; }
    .section-gap { height: 12px; }
    .option-card { overflow: hidden; }
    .option-row { width: 100%; min-height: 58px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border: 0; border-bottom: 1px solid var(--line); color: #424a52; background: transparent; cursor: pointer; text-align: left; font-size: 14px; }
    .option-row:last-child { border-bottom: 0; }
    .option-row span:last-child { color: #9aa1a8; font-size: 23px; }
    .list-title { min-height: 48px; display: flex; justify-content: space-between; align-items: center; color: #66707a; font-size: 13px; font-weight: 650; }
    .list-title button { border: 0; color: #9aa1a8; background: transparent; cursor: pointer; font-size: 19px; }
    .list-card { overflow: hidden; }
    .list-row { position: relative; min-height: 64px; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .list-row:last-child { border-bottom: 0; }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: var(--brand); background: var(--brand-soft); font-size: 11px; font-weight: 750; }
    .row-copy { min-width: 0; flex: 1; }
    .row-copy strong, .row-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-copy strong { color: #343b43; font-size: 13px; }
    .row-copy small { margin-top: 3px; color: #9ba2aa; font-size: 10px; }
    .row-action { min-height: 30px; padding: 0 9px; border: 1px solid rgba(var(--brand-rgb), .25); border-radius: 8px; color: var(--brand); background: var(--brand-soft); cursor: pointer; font-size: 10px; }
    .empty { min-height: 245px; display: grid; place-items: center; align-content: center; gap: 10px; color: #9ca3ab; font-size: 12px; }
    .empty-art { width: 68px; height: 48px; position: relative; border: 2px dashed #c7cdd5; border-radius: 12px; opacity: .8; }
    .empty-art::after { content: ""; position: absolute; width: 26px; height: 26px; right: -10px; bottom: -9px; border: 2px solid #b7c0ca; border-radius: 50%; background: var(--canvas); }
    .account-screen, .qr-screen { min-height: 100%; }
    .account-body, .qr-detail-body { padding: 28px 18px; }
    .account-body h3, .qr-detail-body h3 { margin: 0; text-align: center; font-size: 18px; }
    .account-body p, .qr-detail-body p { margin: 8px 0 22px; color: #9098a2; text-align: center; font-size: 12px; }
    .input-shell { position: relative; }
    .input-shell input { width: 100%; height: 56px; padding: 0 44px 0 15px; border: 1px solid var(--line); border-radius: 10px; outline: 0; color: var(--ink); background: var(--surface); }
    .input-shell input:focus { border-color: rgba(var(--brand-rgb), .5); box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .1); }
    .input-clear { position: absolute; top: 16px; right: 14px; width: 24px; height: 24px; border: 0; border-radius: 50%; color: #fff; background: #bdc3ca; cursor: pointer; line-height: 20px; }
    .primary-button { width: 100%; min-height: 44px; margin-top: 18px; border: 0; border-radius: 22px; color: #fff; background: var(--brand); cursor: pointer; font-weight: 650; }
    .primary-button:disabled { color: #a6adb5; background: #dfe2e6; cursor: not-allowed; }
    .manage-page { min-height: 100%; padding: 18px 14px 32px; }
    .manage-hero { padding: 22px 16px; text-align: center; border-radius: 14px; background: var(--surface); }
    .manage-hero .device-icon { width: 42px; height: 31px; display: block; margin: 0 auto 10px; border: 2px solid var(--brand); border-radius: 8px; }
    .manage-hero strong, .manage-hero small { display: block; }
    .manage-hero strong { font-size: 15px; }
    .manage-hero small { margin-top: 4px; color: #9aa1a8; font-size: 11px; }
    .manage-section h3 { margin: 19px 2px 8px; color: #747d86; font-size: 12px; }
    .modal-layer { position: absolute; z-index: 70; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(19, 23, 29, .33); }
    .dialog { width: min(300px, 100%); overflow: hidden; border-radius: 18px; background: #fff; box-shadow: 0 18px 55px rgba(14, 18, 25, .24); animation: dialog-in 170ms ease-out; }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    .dialog-body { padding: 24px 22px 20px; text-align: center; }
    .dialog-body h3 { margin: 0 0 9px; font-size: 17px; }
    .dialog-body p { margin: 0; color: #78818b; font-size: 12px; line-height: 1.6; }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
    .dialog-actions button { min-height: 45px; border: 0; color: #68717b; background: #fff; cursor: pointer; font-size: 13px; }
    .dialog-actions button + button { border-left: 1px solid var(--line); color: var(--brand); font-weight: 700; }
    .toast { position: absolute; z-index: 90; left: 50%; bottom: 32px; max-width: calc(100% - 36px); transform: translateX(-50%); padding: 10px 14px; border-radius: 10px; color: #fff; background: rgba(26, 30, 36, .92); font-size: 11px; animation: toast-in 160ms ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .stage-footnote { display: flex; justify-content: center; gap: 26px; width: min(650px, 100%); margin-top: 16px; color: #838b94; font-size: 11px; }
    .stage-footnote kbd { padding: 2px 5px; border: 1px solid #d6dbe2; border-radius: 4px; background: #fff; font-size: 10px; }
    .is-hidden { display: none !important; }
    @media (max-height: 930px) and (min-width: 761px) { .phone { transform: scale(.82); margin: -76px 0; } .phone-wrap { min-height: 650px; } }
    @media (max-width: 760px) { body { background: #12151a; } .shell { display: block; } .panel, .stage-head, .stage-footnote { display: none; } .stage { min-height: 100vh; padding: 0; } .phone-wrap { min-height: 100vh; width: 100%; } .phone { width: min(430px, 100vw); height: 100vh; min-height: 700px; border: 0; border-radius: 0; box-shadow: none; } .phone::before, .speaker { display: none; } .app { inset: 0; border-radius: 0; } .status-bar { top: 0; left: 0; right: 0; } .home-indicator { bottom: 8px; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="panel" aria-label="产品 Demo 控制台">
      <div class="brand-head"><span class="brand-mark">D</span><div><strong>产品 Demo Builder</strong><small id="panel-subtitle">离线交互模板 · 可替换 manifest</small></div></div>
      <section class="control-group"><div class="control-label">当前产品</div><div class="segmented" id="product-control"><button class="active" data-control="product" data-value="productA">产品 A</button><button data-control="product" data-value="productB">产品 B</button></div></section>
      <section class="control-group"><div class="control-label">页面预览</div><div class="select-wrap"><select id="page-select" aria-label="选择页面"><option value="share">分享首页</option><option value="account">账号输入</option><option value="manage">成员管理</option><option value="qr">二维码详情</option></select></div></section>
      <section class="control-group"><div class="control-label">二维码状态</div><div class="state-grid" id="qr-control"><button class="active" data-control="qr" data-value="normal">正常<i></i></button><button data-control="qr" data-value="loading">加载中<i></i></button><button data-control="qr" data-value="failed">加载失败<i></i></button><button data-control="qr" data-value="expired">已过期<i></i></button></div></section>
      <section class="control-group"><div class="control-label">最近联系人</div><div class="segmented"><button class="active" data-control="recent" data-value="filled">有数据</button><button data-control="recent" data-value="empty">空状态</button></div></section>
      <div class="panel-actions"><button class="reset" data-action="reset">重置交互</button><button class="primary" data-action="go-home">返回首页</button></div>
      <p class="panel-tip">页面由 HTML / CSS / JavaScript 实时渲染，不使用视觉稿图片。替换 manifest 后保留页面、状态和动作闭环。</p>
    </aside>
    <main class="stage">
      <header class="stage-head"><div><small>OFFLINE PRODUCT EXPERIENCE</small><h1 id="stage-title">产品 A · 分享首页</h1></div><span id="stage-badge" class="stage-badge">产品 A 主题</span></header>
      <div class="phone-wrap" data-target="phone-stage"><div class="phone" role="application" aria-label="离线产品交互 Demo"><div class="speaker"></div><div class="status-bar"><span>09:41</span><span class="status-icons">▮▮▮▮　⌁　<span class="battery"><i></i></span></span></div><div id="app" class="app" data-target="screen-root"></div><div id="toast-root" data-target="toast-root" aria-live="polite"></div><div class="home-indicator"></div></div></div>
      <div class="stage-footnote"><span><kbd>点击手机</kbd> 页面中的真实控件继续操作</span><span><kbd>左侧</kbd> 切换产品、页面和状态</span></div>
    </main>
  </div>
  <script>
  (() => {
    'use strict';

    const DEMO_MANIFEST = {
      meta: { title: '设备分享 Demo', purpose: '演示分享、成员管理与二维码状态', audience: '产品评审', frame: 'phone', language: 'zh-CN', offline: true },
      products: [
        { id: 'productA', name: '产品 A', theme: { brand: '#2f6bff', dark: '#1e4dcc', soft: '#eef3ff' }, capabilities: { manage: true } },
        { id: 'productB', name: '产品 B', theme: { brand: '#8a5bd1', dark: '#6840aa', soft: '#f4efff' }, capabilities: { manage: false } }
      ],
      screens: [{ id: 'share' }, { id: 'account' }, { id: 'manage' }, { id: 'qr' }],
      states: ['normal', 'loading', 'failed', 'expired', 'empty', 'filled', 'confirm', 'success'],
      actions: [
        { id: 'reset', target: 'reset', from: '*', to: 'share' },
        { id: 'go-home', target: 'go-home', from: '*', to: 'share' },
        { id: 'open-account', target: 'open-account', from: 'share', to: 'account' },
        { id: 'open-manage', target: 'open-manage', from: 'share', to: 'manage' },
        { id: 'open-qr', target: 'open-qr', from: 'share', to: 'qr' },
        { id: 'back', target: 'back', from: 'account|manage|qr', to: 'share' },
        { id: 'refresh-qr', target: 'qr-stage', from: 'share|qr', to: 'share|qr' },
        { id: 'clear-input', target: 'clear-input', from: 'account', to: 'account' },
        { id: 'lookup-user', target: 'lookup-user', from: 'account', to: 'confirm' },
        { id: 'select-user', target: 'select-user', from: 'share', to: 'confirm' },
        { id: 'confirm-share', target: 'confirm-share', from: 'confirm', to: 'share' },
        { id: 'clear-recent', target: 'clear-recent', from: 'share', to: 'confirm' },
        { id: 'confirm-clear', target: 'confirm-clear', from: 'confirm', to: 'share' },
        { id: 'delete-contact', target: 'delete-contact', from: 'manage', to: 'confirm' },
        { id: 'confirm-delete', target: 'confirm-delete', from: 'confirm', to: 'manage' },
        { id: 'close-modal', target: 'close-modal', from: 'confirm', to: '*' }
      ],
      acceptanceFlows: [
        { id: 'share-from-recent', actions: ['select-user', 'confirm-share'] },
        { id: 'share-by-account', actions: ['open-account', 'lookup-user', 'confirm-share'] },
        { id: 'refresh-qr', actions: ['open-qr', 'refresh-qr'] },
        { id: 'switch-empty-state', actions: ['clear-recent', 'confirm-clear'] },
        { id: 'reset', actions: ['reset'] }
      ]
    };

    const baseData = {
      recent: [
        { id: 'demo-001', name: 'Demo User A' },
        { id: 'demo-002', name: 'Demo User B' },
        { id: 'demo-003', name: 'Demo User C' }
      ],
      shared: [{ id: 'demo-001', name: 'Demo User A', time: '2026-08-21 10:20' }]
    };
    const state = {
      product: 'productA', screen: 'share', qr: 'normal', recent: 'filled', input: '', modal: null,
      loading: false, toast: '', selectedUser: null, data: structuredClone(baseData)
    };
    const app = document.getElementById('app');
    const toastRoot = document.getElementById('toast-root');
    let timer = null;
    let toastTimer = null;

    function productConfig() { return DEMO_MANIFEST.products.find((item) => item.id === state.product) || DEMO_MANIFEST.products[0]; }
    function capabilities() { return productConfig().capabilities || {}; }
    function esc(value) { return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }
    function initials(name) { return String(name).replace(/[^A-Za-z\u4e00-\u9fff]/g, '').slice(0, 2).toUpperCase() || 'D'; }
    function qr(seed) {
      let value = 2166136261;
      for (let i = 0; i < seed.length; i += 1) { value ^= seed.charCodeAt(i); value = Math.imul(value, 16777619); }
      const cells = [];
      for (let y = 0; y < 21; y += 1) for (let x = 0; x < 21; x += 1) {
        const finder = (ox, oy) => x >= ox && x < ox + 7 && y >= oy && y < oy + 7 && (x === ox || y === oy || x === ox + 6 || y === oy + 6 || (x >= ox + 2 && x <= ox + 4 && y >= oy + 2 && y <= oy + 4));
        value ^= value << 13; value ^= value >>> 17; value ^= value << 5;
        const on = finder(0, 0) || finder(14, 0) || finder(0, 14) || ((value >>> 0) + x * 17 + y * 31) % 7 < 3;
        cells.push(`<i class="${on ? 'on' : ''}"></i>`);
      }
      return `<div class="qr-grid" aria-label="视觉二维码占位，不可扫码">${cells.join('')}</div>`;
    }
    function qrBlock(detail = false) {
      const status = state.qr;
      const overlay = status === 'loading' ? '<span class="qr-overlay"><i class="spinner"></i></span>' : status === 'failed' ? '<span class="qr-overlay">!</span>' : status === 'expired' ? '<span class="qr-overlay">已过期</span>' : '';
      return `<div class="${detail ? 'qr-detail-body' : 'qr-card'}"><h3>${detail ? '设备二维码分享' : '二维码分享设备'}</h3>${detail ? '<p>扫描二维码，添加设备</p>' : ''}<button class="qr-stage" data-action="refresh-qr" data-target="qr-stage" aria-label="刷新视觉二维码">${qr(`${state.product}-${status}`)}${overlay}</button><div class="qr-copy"><div>${status === 'failed' ? '二维码加载失败' : status === 'expired' ? '二维码已过期' : status === 'loading' ? '二维码刷新中' : '20 分钟有效'}</div><small>${status === 'failed' ? '请重试' : status === 'expired' ? '请刷新后重新生成' : '2026-08-21 17:20 前'}</small></div>${detail ? '<button class="text-button" data-action="refresh-qr" data-target="qr-stage">点击二维码刷新</button>' : '<button class="text-button" data-action="open-qr">查看二维码详情</button>'}</div>`;
    }
    function nav(title, right = '') { return `<div class="nav"><button data-action="back" aria-label="返回">‹</button><h2>${esc(title)}</h2>${right || '<span></span>'}</div>`; }
    function contactRows() {
      const list = state.recent === 'empty' ? [] : state.data.recent;
      if (!list.length) return '<div class="empty"><span class="empty-art"></span><span>暂无最近联系人</span></div>';
      return `<div class="list-card">${list.map((user) => `<div class="list-row"><span class="avatar">${esc(initials(user.name))}</span><span class="row-copy"><strong>${esc(user.name)}</strong><small>${esc(user.id)}</small></span><button class="row-action" data-action="select-user" data-id="${esc(user.id)}">选择</button></div>`).join('')}</div>`;
    }
    function shareScreen() { return `<section class="screen" data-screen="share" data-state="${state.qr}">${nav('分享首页', state.product === 'productA' ? '<button class="nav-action" data-action="open-manage">管理</button>' : '')}<div class="scroll"><div class="share-page">${qrBlock()}<div class="section-gap"></div><div class="option-card"><button class="option-row" data-action="open-account"><span>账号分享</span><span>›</span></button><button class="option-row" data-action="open-qr"><span>二维码分享</span><span>›</span></button></div><div class="list-title"><span>最近联系人</span>${state.recent === 'filled' ? '<button data-action="clear-recent" aria-label="清空最近联系人">⌫</button>' : '<small>None</small>'}</div>${contactRows()}</div></div></section>`; }
    function accountScreen() { const enabled = Boolean(state.input.trim()); return `<section class="screen account-screen" data-screen="account" data-state="${enabled ? 'filled' : 'empty'}">${nav('账号分享')}<div class="account-body"><h3>分享给联系人</h3><p>输入账号或手机号后继续</p><div class="input-shell"><input id="account-input" autocomplete="off" placeholder="请输入账号" value="${esc(state.input)}" aria-label="账号" />${enabled ? '<button class="input-clear" data-action="clear-input" aria-label="清空">×</button>' : ''}</div><button class="primary-button" data-action="lookup-user" ${enabled ? '' : 'disabled'}>继续</button></div></section>`; }
    function manageScreen() { const list = capabilities().manage ? state.data.shared : []; return `<section class="screen" data-screen="manage" data-state="${list.length ? 'filled' : 'empty'}">${nav('成员管理')}<div class="scroll"><div class="manage-page"><div class="manage-hero"><span class="device-icon"></span><strong>示例设备</strong><small>客厅</small></div>${list.length ? `<section class="manage-section"><h3>已分享用户</h3><div class="manage-card">${list.map((user) => `<div class="list-row"><span class="avatar">${esc(initials(user.name))}</span><span class="row-copy"><strong>${esc(user.name)}</strong><small>${esc(user.time)}</small></span><button class="row-action" data-action="delete-contact" data-id="${esc(user.id)}">移除</button></div>`).join('')}</div></section>` : '<div class="empty"><span class="empty-art"></span><span>暂无成员</span></div>'}</div></div></section>`; }
    function qrScreen() { return `<section class="screen qr-screen" data-screen="qr" data-state="${state.qr}">${nav('二维码详情')}${qrBlock(true)}</section>`; }
    function modal() { if (!state.modal) return ''; const user = state.selectedUser; const title = state.modal === 'share' ? '确认分享吗？' : state.modal === 'clear' ? '清空最近联系人？' : '移除该成员？'; const body = user ? `${esc(user.name)} · ${esc(user.id)}` : '此操作只影响当前离线演示数据'; const confirm = state.modal === 'share' ? '分享' : state.modal === 'clear' ? '清空' : '移除'; const action = state.modal === 'share' ? 'confirm-share' : state.modal === 'clear' ? 'confirm-clear' : 'confirm-delete'; return `<div class="modal-layer" role="dialog" aria-modal="true"><div class="dialog"><div class="dialog-body"><h3>${title}</h3><p>${body}</p></div><div class="dialog-actions"><button data-action="close-modal">取消</button><button data-action="${action}">${confirm}</button></div></div></div>`; }
    function render() {
      const config = productConfig();
      document.body.style.setProperty('--brand', config.theme.brand); document.body.style.setProperty('--brand-dark', config.theme.dark); document.body.style.setProperty('--brand-soft', config.theme.soft); document.body.style.setProperty('--brand-rgb', config.id === 'productA' ? '47,107,255' : '138,91,209');
      document.getElementById('stage-title').textContent = `${config.name} · ${state.screen === 'share' ? '分享首页' : state.screen === 'account' ? '账号输入' : state.screen === 'manage' ? '成员管理' : '二维码详情'}`;
      document.getElementById('stage-badge').textContent = `${config.name} 主题`;
      document.getElementById('panel-subtitle').textContent = `离线交互模板 · ${config.capabilities.manage ? '支持成员管理' : '仅演示分享链路'}`;
      document.querySelectorAll('[data-control="product"]').forEach((button) => button.classList.toggle('active', button.dataset.value === state.product));
      document.querySelectorAll('[data-control="qr"]').forEach((button) => button.classList.toggle('active', button.dataset.value === state.qr));
      document.querySelectorAll('[data-control="recent"]').forEach((button) => button.classList.toggle('active', button.dataset.value === state.recent));
      document.getElementById('page-select').value = state.screen;
      document.querySelector('[data-control="recent"][data-value="empty"]').disabled = false;
      app.innerHTML = `${state.screen === 'account' ? accountScreen() : state.screen === 'manage' ? manageScreen() : state.screen === 'qr' ? qrScreen() : shareScreen()}${state.loading ? '<div class="modal-layer"><i class="spinner"></i></div>' : ''}${modal()}`;
    }
    function toast(message) { clearTimeout(toastTimer); toastRoot.innerHTML = `<div class="toast">${esc(message)}</div>`; toastTimer = window.setTimeout(() => { toastRoot.innerHTML = ''; }, 1800); }
    function reset() { clearTimeout(timer); state.product = 'productA'; state.screen = 'share'; state.qr = 'normal'; state.recent = 'filled'; state.input = ''; state.modal = null; state.loading = false; state.selectedUser = null; state.data = structuredClone(baseData); render(); toast('演示已重置'); }
    function refreshQr() { if (state.qr === 'loading') return; state.qr = 'loading'; render(); clearTimeout(timer); timer = window.setTimeout(() => { state.qr = 'normal'; render(); toast('二维码已刷新'); }, 700); }
    function submitShare() { if (!state.selectedUser) return; state.modal = null; state.loading = true; render(); clearTimeout(timer); timer = window.setTimeout(() => { state.loading = false; if (!state.data.shared.some((item) => item.id === state.selectedUser.id)) state.data.shared.unshift({ ...state.selectedUser, time: '2026-08-21 10:30' }); state.screen = 'share'; state.input = ''; render(); toast('分享成功'); }, 650); }
    function action(name, element) {
      switch (name) {
        case 'reset': reset(); break;
        case 'go-home': state.screen = 'share'; state.modal = null; render(); break;
        case 'open-account': state.screen = 'account'; state.input = ''; render(); window.setTimeout(() => document.getElementById('account-input')?.focus(), 20); break;
        case 'open-manage': if (capabilities().manage) { state.screen = 'manage'; render(); } else toast('产品 B 不提供成员管理'); break;
        case 'open-qr': state.screen = 'qr'; render(); break;
        case 'back': state.screen = 'share'; state.modal = null; render(); break;
        case 'refresh-qr': refreshQr(); break;
        case 'clear-input': state.input = ''; render(); window.setTimeout(() => document.getElementById('account-input')?.focus(), 20); break;
        case 'lookup-user': if (state.input.trim()) { state.selectedUser = { id: /^\d+$/.test(state.input.trim()) ? state.input.trim() : 'demo-user', name: state.input.trim() }; state.modal = 'share'; render(); } break;
        case 'select-user': state.selectedUser = state.data.recent.find((item) => item.id === element.dataset.id) || null; state.modal = state.selectedUser ? 'share' : null; render(); break;
        case 'delete-contact': state.selectedUser = state.data.shared.find((item) => item.id === element.dataset.id) || null; state.modal = state.selectedUser ? 'delete' : null; render(); break;
        case 'clear-recent': state.modal = 'clear'; render(); break;
        case 'confirm-share': submitShare(); break;
        case 'confirm-clear': state.data.recent = []; state.recent = 'empty'; state.modal = null; render(); toast('最近联系人已清空'); break;
        case 'confirm-delete': if (state.selectedUser) state.data.shared = state.data.shared.filter((item) => item.id !== state.selectedUser.id); state.selectedUser = null; state.modal = null; render(); toast('成员已移除'); break;
        case 'close-modal': state.modal = null; state.selectedUser = null; render(); break;
        default: break;
      }
    }
    document.addEventListener('click', (event) => {
      const control = event.target.closest('[data-control]');
      if (control) { const kind = control.dataset.control; if (kind === 'product') { state.product = control.dataset.value; state.screen = 'share'; } if (kind === 'qr') state.qr = control.dataset.value; if (kind === 'recent') state.recent = control.dataset.value; render(); return; }
      const actionElement = event.target.closest('[data-action]'); if (actionElement) action(actionElement.dataset.action, actionElement);
    });
    document.addEventListener('change', (event) => { if (event.target.id === 'page-select') { state.screen = event.target.value; if (state.screen === 'manage' && !capabilities().manage) state.screen = 'share'; render(); } });
    document.addEventListener('input', (event) => { if (event.target.id === 'account-input') { state.input = event.target.value; const button = document.querySelector('[data-action="lookup-user"]'); if (button) button.disabled = !state.input.trim(); } });
    document.addEventListener('keydown', (event) => { if (event.key === 'Enter' && event.target.id === 'account-input' && state.input.trim()) action('lookup-user', event.target); if (event.key === 'Escape' && state.modal) action('close-modal', event.target); });
    window.addEventListener('beforeunload', () => { clearTimeout(timer); clearTimeout(toastTimer); });
    render();
  })();
  </script>
</body>
</html>
