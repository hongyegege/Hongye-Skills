<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>设备分享统一化 · 合并后交互原型</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      color: #25292e;
      background: #edf0f4;
    }
    body {
      --brand: #ef4c43;
      --brand-rgb: 239, 76, 67;
      --brand-soft: #fff1f0;
      --app-canvas: #f4f5f8;
      --app-surface: #fff;
      --app-text: #2d3132;
      --app-muted: #aeb2b7;
      --app-line: #eceef1;
      --component-radius: 2px;
      --button-radius: 24px;
      --component-gap: 12px;
      --title-weight: 500;
      --icon-radius: 50%;
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 14% 12%, rgba(var(--brand-rgb), .11), transparent 28%),
        radial-gradient(circle at 84% 82%, rgba(75, 105, 190, .10), transparent 28%),
        #edf0f4;
    }
    body[data-product="productB"] {
      --brand: #4d79ff;
      --brand-rgb: 77, 121, 255;
      --brand-soft: #eef3ff;
      --app-canvas: #f2f4f8;
      --app-surface: #fff;
      --app-text: #212126;
      --app-muted: #9da2aa;
      --app-line: #e5e8ee;
      --component-radius: 16px;
      --button-radius: 22px;
      --component-gap: 16px;
      --title-weight: 600;
      --icon-radius: 14px;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 350px minmax(520px, 1fr);
    }
    .control-panel {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 28px 26px;
      border-right: 1px solid rgba(32, 36, 42, .08);
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(22px);
    }
    .brand-head {
      display: flex;
      align-items: center;
      gap: 13px;
      padding-bottom: 22px;
      border-bottom: 1px solid #e5e7ea;
    }
    .brand-logo {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background: var(--brand);
      font-weight: 700;
      box-shadow: 0 9px 24px rgba(var(--brand-rgb), .24);
    }
    .brand-head strong, .brand-head small { display: block; }
    .brand-head strong { font-size: 17px; }
    .brand-head small { margin-top: 3px; color: #7c8289; font-size: 11px; }
    .control-group { margin-top: 22px; }
    .control-label { margin-bottom: 9px; color: #858a91; font-size: 12px; font-weight: 600; }
    .segmented, .control-grid {
      display: grid;
      gap: 6px;
      padding: 4px;
      border-radius: 12px;
      background: #eff1f4;
    }
    .segmented { grid-template-columns: 1fr 1fr; }
    .control-grid { grid-template-columns: 1fr 1fr; }
    .page-groups { display: grid; gap: 12px; }
    .page-group-label { margin: 0 0 7px 4px; color: #9a9fa6; font-size: 11px; }
    .segmented button, .control-grid button {
      min-height: 38px;
      padding: 7px;
      border: 0;
      border-radius: 9px;
      color: #676d74;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
    }
    .segmented button.active, .control-grid button.active {
      color: var(--brand);
      background: #fff;
      font-weight: 600;
      box-shadow: 0 3px 12px rgba(20, 24, 33, .08);
    }
    .control-grid button[hidden] { display: none; }
    .state-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .state-grid button {
      min-height: 38px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e4e6e9;
      border-radius: 10px;
      color: #62676e;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    .state-grid button.active { color: var(--brand); border-color: rgba(var(--brand-rgb), .48); background: var(--brand-soft); }
    .state-grid i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    #recent-state-group[hidden] { display: none; }
    .reset-button {
      width: 100%;
      height: 42px;
      margin-top: 22px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: var(--brand);
      cursor: pointer;
      font-weight: 600;
    }
    .stage {
      min-height: 100vh;
      padding: 28px 36px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stage-head {
      width: min(760px, 100%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }
    .stage-head small { color: var(--brand); font-size: 11px; font-weight: 600; letter-spacing: .08em; }
    .stage-head h1 { margin: 5px 0 0; font-size: 24px; font-weight: 600; }
    .stage-badge { padding: 7px 12px; border-radius: 99px; color: var(--brand); background: var(--brand-soft); font-size: 12px; }
    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      border: 10px solid #17191d;
      border-radius: 48px;
      background: var(--app-surface);
      box-shadow: 0 28px 75px rgba(25, 30, 42, .22);
    }
    .speaker { position: absolute; z-index: 30; top: 9px; left: 50%; width: 83px; height: 20px; transform: translateX(-50%); border-radius: 0 0 14px 14px; background: #17191d; }
    .status-bar {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;
      height: 45px;
      padding: 13px 21px 0;
      display: flex;
      justify-content: space-between;
      color: var(--app-text);
      background: var(--app-surface);
      font-size: 12px;
      font-weight: 600;
    }
    .app { position: absolute; inset: 45px 0 21px; overflow: hidden; background: var(--app-canvas); }
    .home-indicator { position: absolute; z-index: 20; bottom: 6px; left: 50%; width: 122px; height: 5px; transform: translateX(-50%); border-radius: 4px; background: #17191d; }
    .screen { height: 100%; display: flex; flex-direction: column; color: var(--app-text); background: var(--app-canvas); }
    .top-tabs {
      flex: 0 0 59px;
      display: grid;
      grid-template-columns: 54px 1fr 1fr 28px;
      align-items: center;
      background: var(--app-surface);
      border-bottom: 1px solid var(--app-line);
    }
    .back-button, .icon-button { border: 0; color: var(--app-text); background: transparent; cursor: pointer; font-size: 27px; }
    .tab-button { position: relative; height: 59px; border: 0; color: var(--app-text); background: transparent; cursor: pointer; font-size: 16px; }
    .tab-button.active { color: var(--brand); font-weight: 600; }
    .tab-button.active::after { content: ""; position: absolute; left: 15px; right: 15px; bottom: 0; height: 4px; border-radius: 4px 4px 0 0; background: var(--brand); }
    .scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }
    .share-page { min-height: 100%; background: var(--app-canvas); }
    .qr-section { padding: 16px 18px 19px; text-align: center; background: var(--app-surface); }
    .qr-section h2 { margin: 0 0 21px; text-align: left; font-size: 16px; font-weight: var(--title-weight); }
    .qr-stage { position: relative; width: 148px; height: 148px; margin: auto; overflow: hidden; border-radius: var(--component-radius); background: #fff; }
    .qr-grid { width: 148px; height: 148px; padding: 2px; display: grid; grid-template-columns: repeat(41, 1fr); grid-template-rows: repeat(41, 1fr); background: #fff; }
    .qr-cell { background: transparent; }
    .qr-cell.on { background: #080808; }
    .qr-stage.loading .qr-grid, .qr-stage.failed .qr-grid, .qr-stage.expired .qr-grid { opacity: .17; filter: grayscale(1); }
    .qr-overlay { position: absolute; inset: 0; display: grid; place-items: center; }
    .spinner { width: 29px; height: 29px; border: 3px solid rgba(40, 44, 50, .18); border-top-color: var(--app-text); border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .qr-error { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: #2d3132; font-size: 18px; font-weight: 600; }
    .qr-expired { padding: 7px 12px; border-radius: 99px; color: #fff; background: rgba(33, 36, 40, .72); font-size: 12px; }
    .qr-copy { margin-top: 8px; color: var(--app-muted); font-size: 13px; line-height: 20px; }
    .qr-state-panel { margin-top: 12px; color: var(--app-muted); text-align: center; font-size: 12px; line-height: 18px; }
    .qr-state-panel strong { display: block; color: var(--app-text); font-size: 13px; font-weight: 500; }
    .qr-state-panel button { margin-top: 4px; padding: 0; border: 0; border-bottom: 1px solid currentColor; color: var(--brand); background: transparent; cursor: pointer; font-size: 13px; }
    .qr-state-panel.loading strong { color: var(--brand); }
    .qr-state-panel.failed strong, .qr-state-panel.expired strong { color: #717780; }
    .refresh-button { margin-top: 8px; padding: 2px 0; border: 0; border-bottom: 1px solid currentColor; color: #5876e9; background: transparent; cursor: pointer; font-size: 15px; }
    .refresh-button:disabled { opacity: .45; cursor: default; }
    .section-gap { height: var(--component-gap); background: var(--app-canvas); }
    .account-entry {
      width: 100%;
      height: 65px;
      padding: 0 19px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 0;
      color: var(--app-text);
      background: var(--app-surface);
      cursor: pointer;
      text-align: left;
      font-size: 15px;
    }
    .account-entry i { color: var(--app-muted); font-size: 25px; font-style: normal; }
    .list-title { height: 52px; padding: 17px 18px; color: var(--app-text); background: var(--app-surface); font-size: 15px; }
    .contact-list { background: var(--app-surface); }
    .recent-share-block { background: transparent; }
    .recent-title-row { display: flex; align-items: center; justify-content: space-between; }
    .recent-title-row small { color: var(--app-muted); font-size: 13px; }
    body[data-product="productB"] .share-list-page { padding: 16px 16px 40px; }
    body[data-product="productB"] .share-list-page .qr-section,
    body[data-product="productB"] .share-list-page .account-entry,
    body[data-product="productB"] .share-list-page .contact-list {
      overflow: hidden;
      border-radius: 10px;
      background: #fff;
    }
    body[data-product="productB"] .share-list-page .section-gap { height: 16px; background: transparent; }
    body[data-product="productB"] .share-list-page .account-entry { height: 60px; padding: 0 16px; }
    body[data-product="productB"] .share-list-page .list-title {
      height: 50px;
      padding: 18px 16px 8px;
      color: rgba(33, 33, 38, .58);
      background: transparent;
      font-size: 14px;
    }
    body[data-product="productB"] .share-list-page .recent-title-row { min-height: 60px; padding: 0 16px; border-radius: 0; background: transparent; }
    body[data-product="productB"] .share-list-page .recent-share-block.is-empty .recent-title-row { min-height: 50px; padding: 0 16px; border-radius: 0; background: transparent; }
    body[data-product="productB"] .share-list-page .recent-title-row small { color: rgba(33, 33, 38, .42); }
    .recent-empty { min-height: 330px; display: grid; place-items: center; align-content: start; gap: 18px; padding-top: 70px; color: var(--app-muted); text-align: center; font-size: 15px; }
    .empty-art { position: relative; width: 176px; height: 166px; display: block; }
    .empty-art::before { content: ""; position: absolute; left: 6px; right: 7px; bottom: 18px; height: 32px; border-radius: 50% 58% 42% 40%; transform: rotate(-8deg); background: #e1e5eb; }
    .empty-art::after { content: ""; position: absolute; left: 23px; bottom: 37px; width: 132px; height: 17px; transform: skewX(-25deg) rotate(-5deg); background: #ffd2ad; box-shadow: 0 12px 0 #c8946d; }
    .empty-art i { position: absolute; left: 85px; top: 17px; z-index: 2; width: 22px; height: 22px; border-radius: 50%; background: #c7895e; }
    .empty-art i::before { content: ""; position: absolute; left: -6px; top: 22px; width: 32px; height: 48px; border-radius: 46% 46% 35% 35%; background: linear-gradient(90deg, #e7ecef, #fff 46%, #cbd2d6); transform: rotate(-5deg); }
    .empty-art i::after { content: ""; position: absolute; left: -17px; top: 44px; width: 23px; height: 6px; border-radius: 6px; background: #d69a70; transform: rotate(25deg); box-shadow: 35px 29px 0 -1px #d1d5da; }
    .empty-art b, .empty-art em { position: absolute; display: block; z-index: 3; }
    .empty-art b { left: 73px; top: 91px; width: 9px; height: 45px; border-radius: 7px; background: #7a8188; transform: rotate(6deg); box-shadow: 25px -2px 0 #8f969d; }
    .empty-art b::before { content: ""; position: absolute; left: -10px; bottom: -3px; width: 25px; height: 8px; border-radius: 9px 6px 6px 4px; background: #f3f5f6; transform: rotate(-8deg); box-shadow: 29px 4px 0 #f3f5f6; }
    .empty-art em { left: 30px; bottom: 16px; width: 13px; height: 22px; border-radius: 2px 2px 5px 5px; background: #d8dde0; box-shadow: 0 -9px 0 -3px #8fa18f, -5px -14px 0 -4px #9eaf9e, 6px -13px 0 -4px #9eaf9e; }
    body[data-product="productB"] .share-list-page .recent-share-block.is-empty { margin-top: -5px; }
    body[data-product="productB"] .share-list-page .recent-empty { min-height: 330px; padding-top: 32px; color: rgba(33, 33, 38, .42); }
    body[data-product="productB"] .share-list-page .empty-art { transform: scale(.92); }
    body[data-product="productA"] .share-list-page .recent-empty { display: none; }
    body[data-product="productA"] .share-list-page .recent-title-row small { display: inline; }
    .recent-title-row { justify-content: space-between; }
    .clear-recent-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      color: var(--app-muted);
      background: transparent;
      cursor: pointer;
    }
    .trash-icon { position: relative; width: 13px; height: 15px; border: 1.7px solid currentColor; border-top: 0; border-radius: 0 0 2px 2px; }
    .trash-icon::before { content: ""; position: absolute; left: -3px; top: -4px; width: 17px; border-top: 1.7px solid currentColor; }
    .trash-icon::after { content: ""; position: absolute; left: 3px; top: -7px; width: 5px; height: 3px; border: 1.7px solid currentColor; border-bottom: 0; border-radius: 2px 2px 0 0; }
    body[data-product="productB"] .share-list-page .contact-row { min-height: 78px; padding: 10px 16px; border-color: #e2e5eb; }
    body[data-product="productB"] .share-list-page .contact-row:first-child { border-top: 0; }
    body[data-product="productB"] .share-list-page .recent-share-block:not(.is-empty) .contact-list { overflow: hidden; border-radius: 10px; background: #fff; }
    .contact-wrap { position: relative; height: 70px; overflow: hidden; background: #e64c3d; }
    body[data-product="productB"] .contact-wrap { height: 78px; background: #4d79ff; }
    .contact-row, .manage-row, .invite-row {
      width: 100%;
      min-height: 70px;
      padding: 10px 18px;
      display: grid;
      grid-template-columns: 46px 1fr auto;
      gap: 12px;
      align-items: center;
      border: 0;
      border-top: 1px solid var(--app-line);
      color: var(--app-text);
      background: var(--app-surface);
      cursor: pointer;
      text-align: left;
    }
    .contact-row { position: relative; z-index: 2; height: 70px; grid-template-columns: 46px 1fr; transform: translateX(0); transition: transform 180ms ease; }
    body[data-product="productB"] .contact-row { height: 78px; }
    .contact-wrap.revealed .contact-row { transform: translateX(-76px); }
    .swipe-delete {
      position: absolute;
      z-index: 1;
      right: 0;
      top: 0;
      width: 76px;
      height: 100%;
      border: 0;
      color: #fff;
      background: #e64c3d;
      cursor: pointer;
      font-size: 14px;
    }
    body[data-product="productB"] .swipe-delete { background: #4d79ff; }
    .avatar { width: 43px; height: 43px; display: grid; place-items: center; border-radius: var(--icon-radius); color: #fff; background: linear-gradient(145deg, var(--brand), #5b6d93); font-size: 13px; font-weight: 600; }
    .row-copy strong, .row-copy small { display: block; }
    .row-copy strong { font-size: 15px; font-weight: 500; }
    .row-copy small { margin-top: 4px; color: var(--app-muted); font-size: 12px; }
    .manage-hero { padding: 27px 20px 24px; display: grid; place-items: center; background: var(--app-surface); }
    .device-glyph { position: relative; width: 72px; height: 72px; display: grid; place-items: center; border-radius: 50%; background: #f1f2f4; }
    .device-glyph::before { content: ""; width: 23px; height: 46px; border: 1px solid #c7c9cd; border-radius: 3px; background: linear-gradient(90deg, #ddd, #fff 38%, #e7e7e7); }

    .manage-hero small { margin-top: 5px; color: var(--app-muted); font-size: 13px; }

    .manage-section h3, .invite-section h3 { height: 43px; margin: 0; padding: 15px 17px 0; color: var(--app-muted); font-size: 12px; font-weight: 400; }
    .manage-card { background: var(--app-surface); }

    .manage-empty { min-height: 370px; display: grid; place-items: center; align-content: center; gap: 16px; color: var(--app-muted); font-size: 13px; }

    .manage-empty-art b { position: absolute; left: 72px; top: 71px; width: 17px; height: 17px; border: 3px solid rgba(255, 255, 255, .55); border-radius: 50%; }

      }
      function initials(name) {

        return chars || 'U';

      function renderQr(seed) {
        let value = 2166136261;
        for (let i = 0; i < seed.length; i += 1) {
          value ^= seed.charCodeAt(i);
          value = Math.imul(value, 16777619);
        }
        const cells = [];
        const finder = (x, y, ox, oy) => {
          const px = x - ox;
          const py = y - oy;
          if (px < 0 || py < 0 || px > 6 || py > 6) return false;
          return px === 0 || py === 0 || px === 6 || py === 6 || (px >= 2 && px <= 4 && py >= 2 && py <= 4);
        };
        for (let y = 0; y < 41; y += 1) {
          for (let x = 0; x < 41; x += 1) {
            const isFinder = finder(x, y, 0, 0) || finder(x, y, 34, 0) || finder(x, y, 0, 34);
            value ^= value << 13;
            value ^= value >>> 17;
            value ^= value << 5;
            const protectedArea = (x < 8 && y < 8) || (x > 32 && y < 8) || (x < 8 && y > 32);
            const on = isFinder || (!protectedArea && ((value >>> 0) + x * 17 + y * 31) % 9 < 4);
            cells.push(`<i class="qr-cell ${on ? 'on' : ''}"></i>`);
          }
        }
        return `<div class="qr-grid" aria-label="Device sharing QR code">${cells.join('')}</div>`;
      }

      function clearRecentDialog() {
        const isHome = state.product === 'productA';
        return `<div class="modal-layer"><div class="dialog"><div class="dialog-content"><h2>${isHome ? 'Clear all recent contacts?' : '确认清空最近分享人吗？'}</h2></div><div class="dialog-actions"><button data-action="close-dialog">${isHome ? 'Cancel' : '取消'}</button><button data-action="confirm-clear-recent">${isHome ? 'Clear' : '清空'}</button></div></div></div>`;
      }

      function deleteRecentDialog() {
        const user = state.selectedUser;
        const isHome = state.product === 'productA';
        const content = isHome
          ? `${avatar(user)}<h2>${esc(user.name)}</h2><p>ID ${esc(user.id)}</p><p>Are you sure to delete the recently shared person?</p>`
          : '<h2 class="plus-remove-prompt">确定删除最近分享人吗？</h2>';
        return `<div class="modal-layer"><div class="dialog"><div class="dialog-content">${content}</div><div class="dialog-actions"><button data-action="close-dialog">${isHome ? 'Cancel' : '取消'}</button><button data-action="confirm-delete-recent">${isHome ? 'Delete' : '删除'}</button></div></div></div>`;
      }

      function render() {
        const config = cfg();
        const caps = config.capabilities;
        document.body.dataset.product = state.product;
        document.body.dataset.screen = state.screen;
        const qrVisible = (state.screen === 'main' && state.tab === 'share') || state.screen === 'qr';
        const qrStateGroup = document.getElementById('qr-state-group');
        if (qrStateGroup) qrStateGroup.hidden = !qrVisible;
        const recentStateGroup = document.getElementById('recent-state-group');
        if (recentStateGroup) recentStateGroup.hidden = !(state.screen === 'main' && state.tab === 'share');
        const manageStateGroup = document.getElementById('manage-state-group');
        if (manageStateGroup) manageStateGroup.hidden = !((state.screen === 'main' && state.tab === 'manage') || state.screen === 'profileManagement');
        document.querySelectorAll('[data-recent]').forEach((button) => button.classList.toggle('active', button.dataset.recent === state.recentMode));
        document.querySelectorAll('[data-manage]').forEach((button) => button.classList.toggle('active', button.dataset.manage === state.manageMode));
        document.querySelectorAll('[data-switch-product]').forEach((button) => button.classList.toggle('active', button.dataset.switchProduct === state.product));
        document.querySelectorAll('[data-capability="receiveShare"]').forEach((button) => { button.hidden = !caps.receiveShare; });
        document.querySelectorAll('[data-qr]').forEach((button) => button.classList.toggle('active', button.dataset.qr === state.qrStatus));
        document.querySelectorAll('[data-page]').forEach((button) => {
          const active = (button.dataset.page === 'share' && state.screen === 'main' && state.tab === 'share')
            || (button.dataset.page === 'manage' && state.screen === 'main' && state.tab === 'manage')
            || (button.dataset.page === 'qr' && state.screen === 'qr')
            || (button.dataset.page === 'account' && state.screen === 'account')
            || (button.dataset.page === 'profile' && ['profile', 'profileShare', 'profileManagement'].includes(state.screen))
            || (button.dataset.page === 'received' && ['received', 'invitation', 'device'].includes(state.screen))
            || (button.dataset.page === 'popup' && state.screen === 'home');
          button.classList.toggle('active', active);
        });
        const screenNames = { qr: '二维码详情', account: '账号分享', profile: 'Profile 入口', profileShare: '全部设备分享', profileManagement: '设备分享管理', received: '收到的分享', invitation: '邀请详情', home: '邀请弹窗', device: '共享设备' };
        const pageName = state.screen === 'main' ? (state.tab === 'share' ? config.share : config.manage) : (screenNames[state.screen] || state.screen);
        document.getElementById('stage-badge').textContent = `${config.label} Theme · ${pageName}`;

        let content = mainScreen();
        if (state.screen === 'qr') content = qrDetailScreen();
        if (state.screen === 'account') content = accountScreen();
        if (state.screen === 'profile') content = profileScreen();
        if (state.screen === 'profileShare') content = profileShareScreen();
        if (state.screen === 'profileManagement') content = profileManagementScreen();
        if (state.screen === 'received') content = receivedScreen();
        if (state.screen === 'invitation') content = invitationDetail();
        if (state.screen === 'home') content = homeWithPopup();
        if (state.screen === 'device') content = deviceScreen();
        const modal = state.modal === 'share' ? shareDialog() : state.modal === 'delete' ? confirmDeleteDialog() : state.modal === 'deleteRecent' ? deleteRecentDialog() : state.modal === 'clearRecent' ? clearRecentDialog() : '';
        app.innerHTML = `${content}${modal}${state.loading ? '<div class="loading-layer"><i class="spinner"></i></div>' : ''}`;
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toastRoot.innerHTML = `<div class="toast">${esc(message)}</div>`;
        toastTimer = window.setTimeout(() => { toastRoot.innerHTML = ''; }, 1800);
      }

      function switchProduct(product) {
        state.product = product;
        state.modal = null;
        state.receiverPopup = false;
        state.selectedInvitationId = null;
        state.selectedProfileDeviceId = null;
        state.accountReturn = null;
        state.swipedUserId = null;
        if (!cfg().capabilities.receiveShare && ['profile', 'profileShare', 'profileManagement', 'received', 'invitation', 'home', 'device'].includes(state.screen)) {
          state.screen = 'main';
          state.tab = 'share';
          showToast('产品 B 保持现状：不开放接收邀请入口');
        }
        render();
      }

      function refreshQr() {
        if (state.qrStatus === 'loading') return;
        state.qrStatus = 'loading';
        render();
        clearTimeout(timer);
        timer = window.setTimeout(() => {
          state.qrStatus = 'normal';
          state.qrVersion += 1;
          render();
          showToast(state.product === 'productA' ? 'QR code refreshed' : '二维码已刷新');
        }, 900);
      }

      function confirmShare() {
        const user = state.selectedUser;
        if (!user) return;
        const data = currentData();
        state.modal = null;
        state.loading = true;
        render();
        clearTimeout(timer);
        timer = window.setTimeout(() => {
          state.loading = false;
          if (cfg().capabilities.requiresAcceptance) {
            if (!data.pending.some((item) => item.id === user.id)) data.pending.unshift({ ...user, time: '2026.08.11 16:30' });
            showToast('Device shared successfully');
          } else {
            if (!data.shared.some((item) => item.id === user.id)) data.shared.unshift({ ...user, time: '2026.08.11 16:30' });
            showToast('分享成功');
          }
          state.screen = 'main';
          state.tab = 'share';
          state.selectedUser = null;
          render();
        }, 700);
      }

      function resolveInvitation(accepted) {
        const data = state.data.productA;
        const id = state.selectedInvitationId || data.invitations.find((item) => item.status === 'pending')?.id;
        const invitation = data.invitations.find((item) => item.id === id);
        if (!invitation) return;
        if (accepted) invitation.status = 'accepted';
        else invitation.status = 'pending';
        state.receiverPopup = false;
        state.selectedInvitationId = null;
        state.screen = state.screen === 'home' ? 'home' : 'received';
        render();
        showToast(accepted ? 'Device accepted' : 'Invitation refused');
      }

      function handleAction(action, element) {
        switch (action) {
          case 'show-share': state.screen = 'main'; state.tab = 'share'; state.modal = null; render(); break;
          case 'show-manage': state.screen = 'main'; state.tab = 'manage'; state.modal = null; render(); break;
          case 'open-qr': state.screen = 'qr'; state.modal = null; render(); break;
          case 'close-qr': state.screen = 'main'; state.tab = 'share'; render(); break;
          case 'open-account': state.accountReturn = null; state.screen = 'account'; state.input = ''; render(); window.setTimeout(() => document.getElementById('share-account-input')?.focus(), 20); break;
          case 'close-account':
            state.screen = state.accountReturn === 'profileManagement' ? 'profileManagement' : 'main';
            if (state.screen === 'main') state.tab = 'share';
            state.accountReturn = null;
            state.input = '';
            render();
            break;
          case 'clear-input': state.input = ''; render(); window.setTimeout(() => document.getElementById('share-account-input')?.focus(), 20); break;
          case 'lookup-user':
            if (!state.input.trim()) break;
            state.selectedUser = { id: /^\d+$/.test(state.input.trim()) ? state.input.trim() : '603488965', name: state.input.trim() };
            state.modal = 'share'; render(); break;
          case 'select-user':
            if (state.swipedUserId) { state.swipedUserId = null; render(); break; }
            state.selectedUser = currentData().recent.find((item) => item.id === element.dataset.id); state.modal = 'share'; render(); break;
          case 'delete-recent':
            state.selectedUser = currentData().recent.find((item) => item.id === element.dataset.id) || null;
            state.swipedUserId = null;
            if (state.selectedUser) state.modal = 'deleteRecent';
            render();
            break;
          case 'confirm-delete-recent':
            if (!state.selectedUser) break;
            currentData().recent = currentData().recent.filter((item) => item.id !== state.selectedUser.id);
            state.modal = null;
            state.swipedUserId = null;
            state.selectedUser = null;
            render();
            showToast(state.product === 'productA' ? 'Recent contact deleted' : '已删除最近分享人');
            break;
          case 'clear-recent':
            if (state.product === 'productA') break;
            state.swipedUserId = null; state.modal = 'clearRecent'; render(); break;
          case 'confirm-clear-recent':
            if (state.product === 'productA') break;
            currentData().recent = [];
            state.swipedUserId = null;
            state.modal = null;
            render();
            showToast('已清空最近分享人');
            break;
          case 'close-dialog': state.modal = null; state.selectedUser = null; render(); break;
          case 'confirm-share': confirmShare(); break;
          case 'refresh-qr': refreshQr(); break;
          case 'save-qr': showToast('二维码图片已保存'); break;
          case 'manage-user':
            state.selectedUser = [...currentData().pending, ...currentData().shared].find((item) => item.id === element.dataset.id);
            state.selectedUser.kind = element.dataset.kind;
            state.modal = 'delete'; render(); break;
          case 'confirm-delete': {
            const data = currentData();
            if (state.selectedUser.kind === 'pending') data.pending = data.pending.filter((item) => item.id !== state.selectedUser.id);
            else data.shared = data.shared.filter((item) => item.id !== state.selectedUser.id);
            state.modal = null; state.selectedUser = null; render(); showToast('User removed'); break;
          }
          case 'open-profile-share': state.screen = 'profileShare'; render(); break;
          case 'close-profile-share': state.screen = 'profile'; render(); break;
          case 'open-profile-management': state.selectedProfileDeviceId = element.dataset.id; state.screen = 'profileManagement'; render(); break;
          case 'close-profile-management': state.screen = 'profileShare'; render(); break;
          case 'profile-add-user': state.accountReturn = null; state.screen = 'main'; state.tab = 'share'; state.input = ''; render(); break;
          case 'show-received': state.screen = 'received'; state.selectedInvitationId = null; render(); break;
          case 'open-invitation': state.selectedInvitationId = element.dataset.id; state.screen = 'invitation'; render(); break;
          case 'accept-invitation': resolveInvitation(true); break;
          case 'refuse-invitation': resolveInvitation(false); break;
          case 'open-device': state.selectedInvitationId = element.dataset.id; state.screen = 'device'; render(); break;
          case 'close-popup': state.receiverPopup = false; render(); break;
          case 'popup-accept': resolveInvitation(true); break;
          case 'popup-refuse': resolveInvitation(false); break;
          case 'native-back': showToast('Return to device settings'); break;
          case 'reset': clearTimeout(timer); state = initialState(); render(); showToast('Prototype reset'); break;
          default: break;
        }
      }

      document.addEventListener('click', (event) => {
        const productButton = event.target.closest('[data-switch-product]');
        if (productButton) { switchProduct(productButton.dataset.switchProduct); return; }
        const pageButton = event.target.closest('[data-page]');
        if (pageButton) {
          const page = pageButton.dataset.page;
          if (page === 'share' || page === 'manage') { state.screen = 'main'; state.tab = page; }
          if (page === 'qr') state.screen = 'qr';
          if (page === 'account') state.screen = 'account';
          if (page === 'profile' && cfg().capabilities.receiveShare) state.screen = 'profile';
          if (page === 'received' && cfg().capabilities.receiveShare) state.screen = 'received';
          if (page === 'popup' && cfg().capabilities.receiveShare) { state.screen = 'home'; state.receiverPopup = true; }
          state.modal = null; render(); return;
        }
        const qrButton = event.target.closest('[data-qr]');
        if (qrButton) { state.qrStatus = qrButton.dataset.qr; state.modal = null; render(); return; }
        const recentButton = event.target.closest('[data-recent]');
        if (recentButton) { state.recentMode = recentButton.dataset.recent; state.swipedUserId = null; render(); return; }
        const manageButton = event.target.closest('[data-manage]');
        if (manageButton) { state.manageMode = manageButton.dataset.manage; render(); return; }
        const actionElement = event.target.closest('[data-action]');
        if (actionElement) handleAction(actionElement.dataset.action, actionElement);
      });

      document.addEventListener('pointerdown', (event) => {
        const row = event.target.closest('[data-swipe-id]');
        if (!row) return;
        pointerStart = { x: event.clientX, id: row.dataset.swipeId };
      });

      document.addEventListener('pointerup', (event) => {
        if (!pointerStart) return;
        const distance = event.clientX - pointerStart.x;
        if (distance < -38) {
          state.swipedUserId = pointerStart.id;
          render();
        } else if (distance > 38 && state.swipedUserId === pointerStart.id) {
          state.swipedUserId = null;
          render();
        }
        pointerStart = null;
      });

      document.addEventListener('input', (event) => {
        if (event.target.id !== 'share-account-input') return;
        state.input = event.target.value;
        const button = document.getElementById('account-submit');
        if (button) button.disabled = !state.input.trim();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && event.target.id === 'share-account-input' && state.input.trim()) handleAction('lookup-user', event.target);
        if (event.key === 'Escape' && state.modal) { state.modal = null; render(); }
      });

      render();
    })();
  </script>
</body>
</html>
