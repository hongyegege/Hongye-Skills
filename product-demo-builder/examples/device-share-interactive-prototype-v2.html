<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f4f5f7" />
    <title>设备分享现状 · 可交互产品原型</title>
    <style>
:root {
  color-scheme: light;
  --brand: #e64c3d;
  --brand-dark: #c9372b;
  --brand-soft: #fff0ee;
  --brand-rgb: 230, 76, 61;
  --ink: #202326;
  --ink-soft: #676c72;
  --line: #e7e8eb;
  --surface: #ffffff;
  --canvas: #f5f6f8;
  --success: #29a36a;
  --warning: #f18c37;
  --danger: #df3f49;
  --shadow: 0 24px 70px rgba(20, 24, 33, 0.16);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(circle at 18% 14%, rgba(230, 76, 61, 0.10), transparent 28%),
    radial-gradient(circle at 84% 78%, rgba(72, 95, 199, 0.10), transparent 30%),
    #eef0f4;
  color: var(--ink);
}

button,
input {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.prototype-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 330px minmax(560px, 1fr);
}

.prototype-panel {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 32px 28px 24px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(24px);
  border-right: 1px solid rgba(31, 35, 40, 0.08);
  z-index: 20;
}

.panel-brand {
  display: flex;
  gap: 13px;
  align-items: center;
  padding-bottom: 26px;
  border-bottom: 1px solid var(--line);
}

.panel-logo {
  width: 46px;
  height: 46px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: #fff;
  background: linear-gradient(145deg, var(--brand), var(--brand-dark));
  font-weight: 800;
  letter-spacing: -1px;
  box-shadow: 0 10px 26px rgba(var(--brand-rgb), 0.24);
}

.panel-brand strong,
.panel-brand small {
  display: block;
}

.panel-brand strong {
  font-size: 18px;
  line-height: 1.4;
}

.panel-brand small {
  color: var(--ink-soft);
  font-size: 11px;
  margin-top: 2px;
}

.panel-section {
  margin-top: 24px;
}

.panel-label {
  font-size: 12px;
  color: #858a91;
  margin-bottom: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
}

.segmented,
.choice-grid {
  display: grid;
  gap: 7px;
  padding: 4px;
  border-radius: 12px;
  background: #f0f1f3;
}

.segmented {
  grid-template-columns: 1fr 1fr;
}

.view-segmented {
  grid-template-columns: repeat(3, 1fr);
}

.view-segmented button {
  padding-inline: 4px;
  font-size: 11px;
}

.choice-grid {
  grid-template-columns: repeat(3, 1fr);
}

.choice-grid-four {
  grid-template-columns: repeat(2, 1fr);
}

.is-hidden {
  display: none !important;
}

.segmented button,
.choice-grid button {
  border: 0;
  min-height: 38px;
  padding: 8px 7px;
  border-radius: 9px;
  background: transparent;
  color: #676c72;
  cursor: pointer;
  font-size: 12px;
  transition: 160ms ease;
}

.segmented button.active,
.choice-grid button.active {
  color: var(--brand);
  background: #fff;
  font-weight: 700;
  box-shadow: 0 3px 12px rgba(20, 24, 33, 0.08);
}

.page-navigator {
  position: relative;
}

.page-navigator::after {
  content: '';
  position: absolute;
  right: 14px;
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid #747980;
  border-bottom: 1.5px solid #747980;
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.page-navigator select {
  width: 100%;
  height: 44px;
  appearance: none;
  padding: 0 40px 0 13px;
  border: 1px solid var(--line);
  border-radius: 11px;
  color: #3f444a;
  background: #fff;
  font-size: 13px;
  font-weight: 600;
  outline: none;
  cursor: pointer;
}

.page-navigator select:focus {
  border-color: rgba(var(--brand-rgb), 0.52);
  box-shadow: 0 0 0 3px rgba(var(--brand-rgb), 0.09);
}

.panel-disclosure {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  overflow: hidden;
}

.panel-disclosure summary {
  position: relative;
  padding: 12px 38px 12px 13px;
  color: #50555c;
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
  list-style: none;
}

.panel-disclosure summary::-webkit-details-marker {
  display: none;
}

.panel-disclosure summary::after {
  content: '';
  position: absolute;
  right: 15px;
  top: 15px;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid #848990;
  border-bottom: 1.5px solid #848990;
  transform: rotate(45deg);
  transition: transform 160ms ease;
}

.panel-disclosure[open] summary::after {
  top: 18px;
  transform: rotate(225deg);
}

.panel-disclosure .error-simulator {
  padding: 0 10px 10px;
}

.scenario-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.scenario-list button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 11px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #fff;
  color: #595e64;
  cursor: pointer;
  font-size: 12px;
  transition: 160ms ease;
}

.scenario-list button.active {
  color: var(--brand);
  border-color: rgba(var(--brand-rgb), 0.5);
  background: var(--brand-soft);
  font-weight: 650;
}

.error-simulator {
  display: grid;
  gap: 8px;
}

.error-simulator select,
.error-simulator button {
  width: 100%;
  min-height: 40px;
  border-radius: 10px;
  font-size: 12px;
}

.error-simulator select {
  padding: 0 34px 0 11px;
  border: 1px solid var(--line);
  color: #50555c;
  background: #fff;
}

.error-simulator button {
  border: 0;
  color: #fff;
  background: var(--brand);
  cursor: pointer;
  font-weight: 650;
}

.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.dot-green { background: #2db879; }
.dot-orange { background: #ef9344; }
.dot-gray { background: #90959c; }
.dot-purple { background: #876bd5; }
.dot-red { background: #df3f49; }
.dot-blue { background: #4f79d8; }

.panel-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 26px;
}

.button {
  border: 0;
  border-radius: 12px;
  min-height: 44px;
  padding: 0 16px;
  font-weight: 650;
  cursor: pointer;
  transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
}

.button:active {
  transform: scale(0.98);
}

.button-primary {
  color: #fff;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  box-shadow: 0 9px 22px rgba(var(--brand-rgb), 0.22);
}

.button-secondary {
  color: #5e636a;
  background: #eceef1;
}

.panel-tip {
  margin: 20px 2px 0;
  color: #989ca2;
  font-size: 11px;
  line-height: 1.6;
}

.stage {
  position: relative;
  min-height: 100vh;
  padding: 35px 5vw 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stage-header {
  width: min(760px, 100%);
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
}

.eyebrow {
  display: block;
  color: #8c9198;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.14em;
  margin-bottom: 5px;
}

.stage h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: -0.02em;
}

.stage-badge {
  white-space: nowrap;
  padding: 8px 12px;
  border-radius: 99px;
  color: var(--brand);
  background: var(--brand-soft);
  border: 1px solid rgba(var(--brand-rgb), 0.16);
  font-size: 12px;
  font-weight: 650;
}

.phone-wrap {
  flex: 1;
  display: grid;
  place-items: center;
  min-height: 720px;
}

.phone {
  position: relative;
  width: 393px;
  height: 852px;
  padding: 9px;
  overflow: hidden;
  border-radius: 52px;
  background: #111318;
  box-shadow: var(--shadow), inset 0 0 0 2px #2e3035;
}

.phone::before {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 49px;
  pointer-events: none;
  z-index: 30;
}

.phone-speaker {
  position: absolute;
  z-index: 50;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 112px;
  height: 30px;
  border-radius: 18px;
  background: #090a0d;
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.06);
}

.status-bar {
  position: absolute;
  top: 9px;
  left: 9px;
  right: 9px;
  height: 49px;
  padding: 13px 23px 0;
  z-index: 45;
  display: flex;
  justify-content: space-between;
  color: #15171b;
  font-size: 12px;
  font-weight: 720;
  pointer-events: none;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

.signal {
  letter-spacing: -2px;
  font-size: 9px;
}

.battery {
  width: 20px;
  height: 10px;
  border: 1.2px solid currentColor;
  border-radius: 3px;
  padding: 1.5px;
  position: relative;
}

.battery::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 2px;
  width: 2px;
  height: 4px;
  border-radius: 0 1px 1px 0;
  background: currentColor;
}

.battery i {
  display: block;
  height: 100%;
  width: 86%;
  border-radius: 1px;
  background: currentColor;
}

.app-root {
  position: absolute;
  inset: 9px;
  border-radius: 43px;
  overflow: hidden;
  background: var(--canvas);
}

.home-indicator {
  position: absolute;
  z-index: 80;
  bottom: 17px;
  left: 50%;
  transform: translateX(-50%);
  width: 130px;
  height: 5px;
  border-radius: 3px;
  background: #15171b;
  pointer-events: none;
}

.stage-footnote {
  width: min(620px, 100%);
  display: flex;
  justify-content: center;
  gap: 26px;
  color: #7e838a;
  font-size: 11px;
  margin-top: 18px;
}

.insight-view {
  width: min(1040px, 100%);
  flex: 1;
  padding: 2px 0 28px;
  animation: insight-enter 220ms ease-out;
}

@keyframes insight-enter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.insight-hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin: 4px 0 18px;
  padding: 22px 24px;
  border: 1px solid rgba(31, 35, 40, 0.08);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.78);
  box-shadow: 0 14px 42px rgba(25, 31, 42, 0.08);
}

.insight-hero h2,
.insight-hero p {
  margin: 0;
}

.insight-hero h2 {
  font-size: 21px;
  letter-spacing: -0.02em;
}

.insight-hero p {
  max-width: 690px;
  margin-top: 8px;
  color: #6c727a;
  font-size: 13px;
  line-height: 1.7;
}

.insight-principle {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: 1px solid #d7d9e0;
  border-radius: 99px;
  color: #4d535c;
  background: #fff;
  font-size: 11px;
  font-weight: 750;
}

.comparison-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.summary-card {
  min-height: 128px;
  padding: 18px;
  border: 1px solid rgba(31, 35, 40, 0.08);
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 10px 28px rgba(25, 31, 42, 0.06);
}

.summary-card strong,
.summary-card span {
  display: block;
}

.summary-card strong {
  margin: 10px 0 6px;
  font-size: 15px;
}

.summary-card span {
  color: #717780;
  font-size: 12px;
  line-height: 1.55;
}

.summary-index {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: #fff;
  background: #272b32;
  font-size: 11px;
  font-weight: 800;
}

.difference-table-wrap {
  overflow-x: auto;
  border: 1px solid rgba(31, 35, 40, 0.09);
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 12px 34px rgba(25, 31, 42, 0.07);
}

.difference-table {
  min-width: 810px;
}

.difference-row {
  display: grid;
  grid-template-columns: 138px 1.05fr 1.05fr 1.22fr;
}

.difference-row + .difference-row {
  border-top: 1px solid #eceef1;
}

.difference-row > div {
  min-height: 69px;
  padding: 14px 16px;
  color: #5f656d;
  font-size: 12px;
  line-height: 1.55;
}

.difference-row > div + div {
  border-left: 1px solid #eceef1;
}

.difference-head > div {
  min-height: auto;
  padding-block: 12px;
  color: #30343a;
  background: #f7f8fa;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.02em;
}

.difference-row .difference-label {
  color: #30343a;
  font-weight: 750;
}

.product-mark {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.product-mark::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

.product-mark.home { color: #f3130a; }
.product-mark.domestic { color: #4d79ff; }

.status-pill {
  display: inline-flex;
  margin-top: 5px;
  padding: 3px 8px;
  border-radius: 99px;
  color: #236a4a;
  background: #eaf8f1;
  font-size: 10px;
  font-weight: 750;
}

.status-pill.separate {
  color: #8b5b13;
  background: #fff5df;
}

.status-pill.off {
  color: #7b5555;
  background: #f8eeee;
}

.merge-flow {
  display: grid;
  grid-template-columns: 1fr 28px 1fr 28px 1fr 28px 1fr;
  align-items: stretch;
  gap: 7px;
  margin-bottom: 16px;
}

.flow-node {
  min-height: 86px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border: 1px solid rgba(31, 35, 40, 0.09);
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 8px 24px rgba(25, 31, 42, 0.05);
}

.flow-node strong,
.flow-node span {
  display: block;
}

.flow-node strong {
  font-size: 13px;
}

.flow-node span {
  margin-top: 5px;
  color: #7b8189;
  font-size: 10px;
  line-height: 1.45;
}

.flow-node.shared {
  border-color: #cadccf;
  background: #f5fbf7;
}

.flow-arrow {
  display: grid;
  place-items: center;
  color: #a0a5ac;
  font-size: 21px;
}

.merged-phones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.merged-product {
  --product-color: #f3130a;
  --product-soft: #fff1f0;
  padding: 16px;
  border: 1px solid rgba(31, 35, 40, 0.09);
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 14px 38px rgba(25, 31, 42, 0.08);
}

.merged-product.domestic-theme {
  --product-color: #4d79ff;
  --product-soft: #eef3ff;
}

.merged-product-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.merged-product-head strong,
.merged-product-head small {
  display: block;
}

.merged-product-head strong {
  font-size: 15px;
}

.merged-product-head small {
  margin-top: 3px;
  color: #858a91;
  font-size: 10px;
}

.theme-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border-radius: 99px;
  color: var(--product-color);
  background: var(--product-soft);
  font-size: 10px;
  font-weight: 750;
}

.theme-chip::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--product-color);
}

.merged-device-screen {
  overflow: hidden;
  border: 7px solid #1d2025;
  border-radius: 30px;
  background: #f3f4f7;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
}

.merged-status {
  height: 26px;
  padding: 8px 14px 0;
  display: flex;
  justify-content: space-between;
  color: #24272c;
  background: #fff;
  font-size: 8px;
  font-weight: 750;
}

.merged-nav {
  min-height: 48px;
  display: grid;
  grid-template-columns: 46px 1fr 46px;
  align-items: center;
  border-bottom: 1px solid #eceef2;
  background: #fff;
}

.merged-back {
  padding-left: 15px;
  color: #2a2d32;
  font-size: 21px;
}

.merged-title {
  text-align: center;
  font-size: 13px;
  font-weight: 750;
}

.merged-tabs {
  height: 48px;
  display: flex;
  align-items: end;
  justify-content: center;
  gap: 36px;
  background: #fff;
}

.merged-tabs span {
  height: 32px;
  color: #8b9097;
  font-size: 12px;
}

.merged-tabs .active {
  position: relative;
  color: #292d33;
  font-weight: 750;
}

.merged-tabs .active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  border-radius: 2px;
  background: var(--product-color);
}

.merged-body {
  min-height: 412px;
  padding: 14px 14px 18px;
  background: #f3f4f7;
}

.merged-qr-card {
  padding: 16px;
  border-radius: 13px;
  background: #fff;
  text-align: center;
}

.merged-qr-card strong {
  display: block;
  font-size: 12px;
}

.merged-qr-placeholder {
  width: 102px;
  height: 102px;
  margin: 12px auto 8px;
  border: 6px solid #fff;
  background:
    linear-gradient(90deg, #1d2025 10px, transparent 10px) 0 0 / 18px 18px,
    linear-gradient(#1d2025 10px, transparent 10px) 0 0 / 18px 18px,
    #fff;
  box-shadow: 0 0 0 1px #dfe2e7;
}

.merged-qr-card small {
  color: #8b9097;
  font-size: 9px;
}

.merged-action-row {
  height: 47px;
  margin-top: 10px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: 12px;
  color: #30343a;
  background: #fff;
  font-size: 11px;
  font-weight: 650;
}

.merged-action-row i {
  color: var(--product-color);
  font-style: normal;
}

.merged-list-title {
  margin: 14px 2px 7px;
  color: #838891;
  font-size: 10px;
}

.merged-list {
  overflow: hidden;
  border-radius: 12px;
  background: #fff;
}

.merged-list-row {
  height: 45px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 9px;
  color: #484d54;
  font-size: 10px;
}

.merged-list-row + .merged-list-row {
  border-top: 1px solid #eceef1;
}

.merged-avatar {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: var(--product-color);
  font-size: 9px;
  font-weight: 750;
}

.merged-rule {
  min-height: 78px;
  margin-top: 12px;
  padding: 12px 13px;
  border-left: 3px solid var(--product-color);
  border-radius: 10px;
  color: #60666e;
  background: var(--product-soft);
  font-size: 10px;
  line-height: 1.6;
}

.merged-rule b {
  color: #34383e;
}

.merged-open {
  width: 100%;
  height: 40px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  color: #fff;
  background: var(--product-color);
  cursor: pointer;
  font-size: 11px;
  font-weight: 750;
}

kbd {
  padding: 3px 6px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(30, 34, 40, 0.08);
  box-shadow: 0 2px 5px rgba(20, 24, 33, 0.05);
  font-family: inherit;
}

/* Phone application */

.screen {
  min-height: 100%;
  padding-top: 49px;
  display: flex;
  flex-direction: column;

  function plusDeadline() {

    const day = String(date.getDate()).padStart(2, '0');
    const hour = String(date.getHours()).padStart(2, '0');
    const minute = String(date.getMinutes()).padStart(2, '0');
    return `20分钟有效（${month}月${day}日 ${hour}:${minute}前）`;
  }

    const qrStatus = state.plusQrLoading ? 'loading' : state.plusQrStatus;
    const saveDisabled = qrStatus === 'loading' || qrStatus === 'failed' || qrStatus === 'expired';
    const scanText = qrStatus === 'failed'
      ? '二维码加载失败，请重试'
      : qrStatus === 'expired'
        ? '二维码已失效'
        : '扫描二维码，添加设备';
    const deadlineText = qrStatus === 'failed'
      ? '请点击刷新重新生成'

      <section class="tp-screen tp-qr-screen">

  function comparisonView() {
    const rows = [
      ['信息架构', 'Share / Manage 双 Tab，Share 为默认入口', '以“设备分享”为单入口，不提供 Manage', '统一返回、分享方式、最近联系人和操作反馈；导航形态按产品保留'],

      ['二维码分享', '20 分钟有效、Refresh、跨区异常', '二维码生成、刷新、保存到相册', '复用生成/刷新/过期/失败状态；保存和异常能力按 capabilities 开关'],

      ['主题与品牌', 'productA 红色主题、英文业务文案', '产品 B蓝色主题、中文业务文案', '共享 ThemeContract，不合并 ThemeData；颜色、图标和文案按产品注入'],
    ];
    return `

          <h2>统一交互骨架，保留产品界面差异</h2>

          <div class="merged-status"><span>09:41</span><span>● ◒ ▰</span></div>
          <div class="merged-nav"><span class="merged-back">‹</span><span class="merged-title">${isHome ? '' : '设备分享'}</span><span></span></div>

          <div class="merged-body">
            <div class="merged-qr-card">
              <strong>${isHome ? 'QR code sharing device' : '设备二维码分享'}</strong>
              <div class="merged-qr-placeholder"></div>
              <small>${isHome ? '20 minutes effective · Refresh' : '20 分钟有效 · 刷新二维码'}</small>
            </div>
            <div class="merged-action-row"><span>${isHome ? 'Email / Phone / Demo Account ID' : '手机号 / 用户 ID 分享'}</span><i>›</i></div>
            <div class="merged-list-title">${isHome ? 'Recent contact' : '最近分享人'}</div>
            <div class="merged-list">
              <div class="merged-list-row"><span class="merged-avatar">A</span><span>${isHome ? '产品 A User · ID 453749304' : '166****6267 · 1035134334'}</span></div>
              <div class="merged-list-row"><span class="merged-avatar">B</span><span>${isHome ? 'Family account · ID 539163011' : '134****9719 · 1035110105'}</span></div>
            </div>
          </div>
        </div>
        <div class="merged-rule"><b>${isHome ? '保留 Manage：' : '不提供 Manage：'}</b>${isHome ? '后端支持等待接受、已分享成员查询以及 Withdraw / Remove，继续采用 Share / Manage 双 Tab。' : '导航、路由和接口层均不暴露成员管理；只呈现账号与二维码分享，避免产生不可用入口。'}</div>
        <button class="merged-open" data-action="${isHome ? 'open-merged-productA' : 'open-merged-domestic'}">进入${isHome ? ' productA' : '产品 B'}可交互原型</button>
      </article>`;
  }

  function mergedView() {
    return `
      <div class="insight-hero">
        <div>
          <h2>合并方案产品原型</h2>
          <p>一套 Flutter MVVM 交互骨架承接两套产品 View。ViewModel、UiState 与领域 UseCase 尽量复用；Product Strategy、页面组合、主题和文案按 productA / 产品 B分别装配。</p>
        </div>
        <span class="insight-principle">同骨架 · 双界面 · 双主题</span>
      </div>
      <div class="merge-flow" aria-label="合并方案分层">
        <div class="flow-node"><strong>产品 View</strong><span>productA / 产品 B分别组合页面</span></div><div class="flow-arrow">→</div>
        <div class="flow-node shared"><strong>共享 MVVM 骨架</strong><span>UiAction · UiState · UiEffect</span></div><div class="flow-arrow">→</div>
        <div class="flow-node"><strong>Product Strategy</strong><span>能力、字段、文案、错误映射</span></div><div class="flow-arrow">→</div>
        <div class="flow-node"><strong>独立 API Adapter</strong><span>productA API / 产品 B API</span></div>
      </div>
      <div class="merged-phones">
        ${mergedProductCard('home')}
        ${mergedProductCard('domestic')}
      </div>`;
  }

  function plusDialog() {
    if (!state.modal || !String(state.modal.type).startsWith('plus')) return '';
    const type = state.modal.type;
    const user = state.selectedUser || state.plusContacts[0];
    const withAvatar = type === 'plusShare';
    let title = '提示';
    let subtitle = '';
    let confirmText = '确定';
    if (type === 'plusShare') {
      title = user?.name || '产品 A用户';
      subtitle = '确定分享吗?';
      confirmText = '分享';
    } else if (type === 'plusClear') {
      title = '确认清空最近分享人吗？';
      confirmText = '清空';
    } else if (type === 'plusRemove') {
      title = '移除使用权限吗？';
      confirmText = '确认';
    }
    return `
      <div class="tp-modal-layer">
        <div class="tp-dialog">
          <div class="tp-dialog-content">
            ${withAvatar ? plusAvatar('large') : ''}
            <h3>${title}</h3>
            ${subtitle ? `<p>${subtitle}</p>` : ''}
          </div>
          <div class="tp-dialog-actions">
            <button data-action="plus-close-dialog">取消</button>
            <button data-action="plus-confirm-dialog">${confirmText}</button>
          </div>
        </div>
      </div>`;
  }

  function confirmationModal() {
    const user = state.selectedUser || contacts[0];
    const kind = state.modal?.kind || 'share';
    const message = kind === 'share'
      ? 'Are you sure to share the device? The other party can use it after logging in to 产品 A APP and agreeing'
      : kind === 'withdraw'
        ? 'Are you sure you want to withdraw the equipment sharing?'
        : kind === 'deleteRecent'
          ? 'Are you sure to delete the recently shared person?'
          : 'Are you sure to remove the user from this shared device?';
    const confirmText = kind === 'deleteRecent' ? 'Delete' : 'Confirm';
    return `
      <div class="th-modal-layer">
        <div class="th-confirm-card">
          ${defaultAvatar('large')}
          <strong class="th-confirm-name">${user.name}</strong>
          <span class="th-confirm-id">ID ${user.id}</span>
          <p>${message}</p>
          <div class="th-confirm-actions">
            <button data-action="close-modal">Cancel</button>
            <button class="confirm" data-action="confirm-modal">${confirmText}</button>
          </div>
        </div>
      </div>`;
  }

  function errorModal() {
    const key = state.modal?.errorKey || (state.modal?.type === 'crossRegion' ? '10600' : 'network');
    const configs = {
      network: {
        title: 'Network error',
        message: 'Network exception, please refresh',
        buttons: '<div class="th-alert-actions single"><button class="confirm" data-action="close-modal">OK</button></div>',
      },
      10154: {
        title: 'Share Failed',
        message: "Recipient's app is out of date. Ask them to update and try again.",
        buttons: '<div class="th-alert-actions single"><button class="confirm" data-action="close-modal">OK</button></div>',
      },
      10600: {
        title: 'Notice',
        message: 'Sharing is not supported across different server regions.',
        buttons: '<div class="th-alert-actions single"><button class="confirm" data-action="close-modal">OK</button></div>',
      },
      10601: {
        title: 'Notice',
        message: 'Sharing is not supported across different server regions. You can try changing the data storage area and give it another try.',
        buttons: '<div class="th-alert-actions vertical"><button class="confirm" data-action="migration-guide">Confirm and Change</button><button data-action="close-modal">Cancel</button></div>',
      },
      10602: {
        title: 'Notice',
        message: 'Sharing is not supported across different server regions. Please have the other party migrate their data storage region through “Profile” - “Settings” - “Change data storage region”.',
        buttons: '<div class="th-alert-actions single"><button class="confirm" data-action="close-modal">OK</button></div>',
      },
      10603: {
        title: 'Notice',
        message: 'Data sharing is not supported between different server regions. If cross-server access is detected, it is recommended to change the data storage region and then try again. The other party can also migrate the data storage region through “Personal Profile” - “Settings” - “Change Data Storage Region”.',
        buttons: '<div class="th-alert-actions vertical"><button class="confirm" data-action="migration-guide">Confirm and Change</button><button data-action="close-modal">Cancel</button></div>',
      },
    };
    const config = configs[key] || configs.network;
    return `
      <div class="th-modal-layer" role="dialog" aria-modal="true" aria-labelledby="th-error-title" aria-describedby="th-error-message">
        <div class="th-alert-card">
          <h3 id="th-error-title">${config.title}</h3>
          <p id="th-error-message">${config.message}</p>
          ${config.buttons}
        </div>
      </div>`;
  }

  function loadingLayer() {
    return state.loading ? `<div class="th-loading-layer"><span class="th-loading-spinner"></span></div>` : '';
  }

  function modalLayer() {
    if (!state.modal) return '';
    if (String(state.modal.type).startsWith('plus')) return plusDialog();
    if (state.modal.type === 'confirm') return confirmationModal();
    if (state.modal.type === 'network' || state.modal.type === 'crossRegion' || state.modal.type === 'homeShareError') return errorModal();
    return '';
  }

  function render() {
    const isPlus = state.app === 'productB';
    const isPrototype = state.view === 'prototype';
    const viewPalette = state.view === 'compare'
      ? ['#5b57c9', '#413da8', '#f1f0ff', '91, 87, 201']
      : state.view === 'merged'
        ? ['#21806c', '#176452', '#eaf8f4', '33, 128, 108']
        : isPlus
          ? ['#4d79ff', '#315de0', '#eef3ff', '77, 121, 255']
          : ['#f3130a', '#d92a21', '#fff1f0', '243, 19, 10'];
    document.documentElement.style.setProperty('--brand', viewPalette[0]);
    document.documentElement.style.setProperty('--brand-dark', viewPalette[1]);
    document.documentElement.style.setProperty('--brand-soft', viewPalette[2]);
    document.documentElement.style.setProperty('--brand-rgb', viewPalette[3]);
    document.body.classList.toggle('view-compare', state.view === 'compare');
    document.body.classList.toggle('view-merged', state.view === 'merged');
    stage.classList.toggle('insight-mode', !isPrototype);
    phoneView.classList.toggle('is-hidden', !isPrototype);
    insightView.classList.toggle('is-hidden', isPrototype);

    document.querySelectorAll('[data-config="view"]').forEach((button) => {
      button.classList.toggle('active', button.dataset.value === state.view);
    });

    document.querySelectorAll('[data-config="app"]').forEach((button) => {
      button.classList.toggle('active', button.dataset.value === state.app);
    });
    document.querySelectorAll('[data-view-only]').forEach((element) => {
      element.classList.toggle('is-hidden', element.dataset.viewOnly !== state.view);
    });
    document.querySelectorAll('[data-app-only]').forEach((element) => {
      element.classList.toggle('is-hidden', !isPrototype || element.dataset.appOnly !== state.app);
    });

    const activePage = isPlus
      ? state.plusScreen === 'home' && state.plusScenario === 'recentEmpty'
        ? 'plus-recent-empty'
        : state.plusScreen === 'shared' && state.plusSharedEmpty
          ? 'plus-shared-empty'
          : `plus-${state.plusScreen}`
      : state.screen === 'account'
        ? 'home-account'
        : state.screen === 'qrDetail'
          ? 'home-qr-detail'
        : state.screen === 'profile'
          ? 'home-profile'
          : state.screen === 'receiverHome'
            ? 'home-popup'
            : state.screen === 'invitations' || state.screen === 'invitationDetail' || state.screen === 'acceptedDevice'
          ? 'home-invitations'
          : state.activeTab === 'manage'
            ? (state.pendingUsers.length || state.acceptedUsers.length ? 'home-manage' : 'home-manage-empty')
            : (state.recentContacts.length ? 'home-share' : 'home-recent-empty');
    const pageActionByPage = {
      'home-share': 'show-share-filled',
      'home-recent-empty': 'show-home-recent-empty',
      'home-manage': 'show-manage-filled',
      'home-manage-empty': 'show-home-manage-empty',
      'home-qr-detail': 'show-home-qr-detail',
      'home-account': 'open-account-input',
      'home-profile': 'show-profile',
      'home-popup': 'show-invite-popup',
      'home-invitations': 'show-invitations',
      'plus-home': 'plus-home-filled',
      'plus-recent-empty': 'plus-recent-empty',
      'plus-account': 'plus-account',
      'plus-qr': 'plus-qr',
      'plus-shared': 'plus-shared-filled',
      'plus-shared-empty': 'plus-shared-empty',
    };
    const activePageSelect = isPlus ? plusPageSelect : homePageSelect;
    if (activePageSelect && pageActionByPage[activePage]) {
      activePageSelect.value = pageActionByPage[activePage];
    }

    const showQrState = isPrototype && (isPlus
      ? state.plusScreen === 'qr'
      : (state.screen === 'main' && state.activeTab === 'share') || state.screen === 'qrDetail');
    qrStateSection.classList.toggle('is-hidden', !showQrState);

    document.querySelectorAll('[data-config="scenario"]').forEach((button) => {
      button.classList.toggle('active', button.dataset.value === state.scenario);
    });
    document.querySelectorAll('[data-config="plus-scenario"]').forEach((button) => {
      button.classList.toggle('active', button.dataset.value === state.plusScenario);
    });
    document.querySelectorAll('[data-config="plus-qr-state"]').forEach((button) => {
      const current = state.plusQrLoading ? 'loading' : state.plusQrStatus;
      button.classList.toggle('active', button.dataset.value === current);
    });

    if (!isPrototype) {
      const isCompare = state.view === 'compare';
      stageTitle.textContent = isCompare ? 'productA / 产品 B差异对比' : '设备分享合并方案产品原型';
      stageBadge.textContent = isCompare ? '统一骨架 · 差异保留' : '一套 Flutter · 两套 View';
      panelSubtitle.textContent = isCompare ? '产品能力与界面差异对比' : '合并后的双产品原型图';
      panelTip.textContent = isCompare
        ? '对齐对象是交互骨架与状态模型，不是把两套界面强制合成一套。产品 B不提供 Manage。'
        : '两套产品 View 共享 MVVM 状态与业务骨架，分别使用 productA 红色主题和产品 B蓝色主题。';
      stageFootnoteAction.innerHTML = isCompare ? '<kbd>查看</kbd> 统一项、差异项与合并策略' : '<kbd>点击</kbd> 两张原型图下方按钮进入完整交互';
      stageFootnoteSecondary.innerHTML = '<kbd>控制台</kbd> 在产品原型、差异对比和合并方案之间切换';
      insightView.innerHTML = isCompare ? comparisonView() : mergedView();
      app.innerHTML = '';
      return;
    }

    insightView.innerHTML = '';
    stageFootnoteSecondary.innerHTML = '<kbd>左侧</kbd> 切换 App、分享页面与二维码状态';

    if (isPlus) {
      const screenNames = { home: '设备分享', account: '号码分享', qr: '设备二维码分享', shared: '已分享管理' };
      stageBadge.textContent = `产品 B · ${screenNames[state.plusScreen] || '设备分享'}`;
      stageTitle.textContent = '产品 B 分享页面现状';
      panelSubtitle.textContent = '产品 B 当前页面 · 纯代码交互还原';
      panelTip.textContent = '页面为真实 DOM，不使用图片；分享方式、号码输入、二维码刷新、最近分享人和已分享移除均可点击。';
      panelPrimaryAction.textContent = '返回分享首页';
      stageFootnoteAction.innerHTML = '<kbd>点击手机</kbd> 账号、二维码、已分享和移除操作';
    } else {
      const homeScreenName = state.screen === 'account'
        ? 'Account input'
        : state.screen === 'qrDetail' ? 'QR detail'
        : state.screen === 'profile' ? 'Profile entry'
          : state.screen === 'receiverHome' ? 'Invitation popup'
            : state.screen === 'invitations' ? 'Accept list'
              : state.screen === 'invitationDetail' ? 'Share request'
                : state.screen === 'acceptedDevice' ? 'Accepted device'
            : state.activeTab === 'share' ? 'Share' : 'Manage';
      stageBadge.textContent = `产品 A · ${homeScreenName}`;
      stageTitle.textContent = '产品 A 分享页面现状';
      panelSubtitle.textContent = '产品 A 当前页面 · 纯代码交互还原';
      panelTip.textContent = '页面为真实 DOM，不使用图片；Share / Manage、账号输入、二维码刷新、被分享请求、撤回和移除均可点击。';
      panelPrimaryAction.textContent = '返回 Share';
      stageFootnoteAction.innerHTML = '<kbd>点击手机</kbd> Share / Manage、联系人、Refresh 和 Accept';
    }

    const homeScreen = state.screen === 'account'
      ? accountScreen()
      : state.screen === 'qrDetail' ? qrDetailScreen()
      : state.screen === 'profile' ? profileEntryScreen()
        : state.screen === 'receiverHome' ? receiverHomeScreen()
          : state.screen === 'invitations' ? invitationScreen()
            : state.screen === 'invitationDetail' ? invitationDetailScreen()
              : state.screen === 'acceptedDevice' ? acceptedDeviceScreen()
                : mainScreen();
    app.innerHTML = `${isPlus ? plusMainScreen() : homeScreen}${modalLayer()}${loadingLayer()}`;
  }

  function scenarioLabel(value) {
    const map = {
      normal: 'Normal',
      qrLoading: 'QR Loading',
      qrFailed: 'QR Failed',
      qrExpired: 'QR Expired',
      recentEmpty: 'Recent Empty',
      manageUsers: 'Manage Users',
      crossRegion: 'Cross Region',
      network: 'Network Error',
    };
    return map[value] || 'Normal';
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    toastRoot.innerHTML = `<div class="toast">${message}</div>`;
    toastTimer = window.setTimeout(() => { toastRoot.innerHTML = ''; }, 1900);
  }

  function runLoading(callback, delay = 700) {
    const sequence = ++state.asyncSequence;
    state.loading = true;
    render();
    window.setTimeout(() => {
      if (sequence !== state.asyncSequence) return;
      state.loading = null;
      callback();
    }, delay);
  }

  function findUser(id) {
    return [...state.recentContacts, ...state.pendingUsers, ...state.acceptedUsers].find((user) => user.id === id);
  }

  function futureTimeLabel() {
    const date = new Date(Date.now() + 20 * 60 * 1000);
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hour = String(date.getHours()).padStart(2, '0');
    const minute = String(date.getMinutes()).padStart(2, '0');
    return `Before ${year}-${month}-${day} ${hour}:${minute}`;
  }

  function refreshQr() {
    if (refreshTimer) clearTimeout(refreshTimer);
    state.scenario = 'qrLoading';
    render();
    refreshTimer = window.setTimeout(() => {
      state.scenario = 'normal';
      state.qrVersion += 1;
      state.qrBefore = futureTimeLabel();
      render();
    }, 1100);
  }

  function lookupUser() {
    if (!state.inputValue.trim()) return;
    if (state.scenario === 'network') {
      state.modal = { type: 'network' };
      render();
      return;
    }
    runLoading(() => {
      const raw = state.inputValue.trim();
      state.selectedUser = {
        id: /^\d+$/.test(raw) ? raw : '603488965',
        name: raw.includes('@') ? raw : '产品 A User',
      };
      state.modal = { type: 'confirm', kind: 'share' };
      render();
    });
  }

  function confirmCurrentAction() {
    const kind = state.modal?.kind;
    state.modal = null;
    if (kind === 'share') {
      if (state.scenario === 'crossRegion') {
        state.modal = { type: 'crossRegion' };
        render();
        return;
      }
      runLoading(() => {
        state.screen = 'main';
        state.activeTab = 'share';
        state.inputValue = '';
        render();
        showToast('Device shared successfully');
      }, 850);
      return;
    }

    if (kind === 'withdraw') {
      state.pendingUsers = state.pendingUsers.filter((user) => user.id !== state.selectedUser.id);
    } else if (kind === 'remove') {
      state.acceptedUsers = state.acceptedUsers.filter((user) => user.id !== state.selectedUser.id);
    } else if (kind === 'deleteRecent') {
      state.recentContacts = state.recentContacts.filter((user) => user.id !== state.selectedUser.id);
      state.swipedUserId = null;
      state.selectedUser = null;
      render();
      showToast('Recent contact deleted');
      return;
    }
    render();
    showToast('User removed successfully');
  }

  function findPlusUser(id) {
    return state.plusContacts.find((user) => user.id === id);
  }

  function plusLookupUser() {
    if (!state.plusInputValue) return;
    if (state.plusScenario === 'network') {
      showToast('分享失败');
      return;
    }
    runLoading(() => {
      const raw = state.plusInputValue.trim();
      state.selectedUser = {
        id: /^\d+$/.test(raw) ? raw : '1035134334',
        name: /^1\d{10}$/.test(raw) ? `${raw.slice(0, 3)}****${raw.slice(-4)}` : raw || '产品 A用户',
      };
      state.modal = { type: 'plusShare' };
      render();
    }, 650);
  }

  function plusConfirmDialog() {
    const type = state.modal?.type;
    state.modal = null;
    if (type === 'plusShare') {
      runLoading(() => {
        state.plusScreen = 'home';
        state.plusInputValue = '';
        if (state.selectedUser && !state.plusContacts.some((user) => user.id === state.selectedUser.id)) {
          state.plusContacts.unshift({ ...state.selectedUser });
        }
        render();
        showToast('分享成功');
      }, 780);
      return;
    }
    if (type === 'plusClear') {
      state.plusContacts = [];
      render();
      showToast('已清空最近分享人');
      return;
    }
    if (type === 'plusRemove') {
      state.plusSharedUsers = state.plusSharedUsers.filter((user) => user.id !== state.selectedUser?.id);
      state.selectedUser = null;
      render();
      showToast('已移除使用权限');
      return;
    }
    render();
  }

  function plusRefreshQr() {
    if (state.plusQrLoading) return;
    state.plusQrLoading = true;
    state.plusQrStatus = 'loading';
    render();
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = window.setTimeout(() => {
      state.plusQrLoading = false;
      if (state.plusScenario === 'network') {
        state.plusQrStatus = 'failed';
      } else {
        state.plusQrStatus = 'normal';
        state.plusQrVersion += 1;
      }
      render();
      if (state.plusScenario !== 'network') showToast('二维码已刷新');
    }, 1050);
  }

  function handleAction(action, element) {
    switch (action) {
      case 'open-current-home':
        if (state.app === 'productB') {
          state.plusScreen = 'home';
        } else {
          state.screen = 'main';
          state.activeTab = 'share';
        }
        state.modal = null;
        render();
        break;
      case 'open-merged-productA':
        state = initialState('productA', 'prototype');
        render();
        break;
      case 'open-merged-domestic':
        state = initialState('productB', 'prototype');
        render();
        break;
      case 'show-share':
        state.screen = 'main';
        state.activeTab = 'share';
        state.swipedUserId = null;
        render();
        break;
      case 'show-share-filled':
        state.screen = 'main';
        state.activeTab = 'share';
        state.recentContacts = contacts.map((item) => ({ ...item }));
        state.swipedUserId = null;
        render();
        break;
      case 'show-home-recent-empty':
        state.screen = 'main';
        state.activeTab = 'share';
        state.recentContacts = [];
        state.swipedUserId = null;
        state.modal = null;
        render();
        break;
      case 'show-manage':
        state.screen = 'main';
        state.activeTab = 'manage';
        state.swipedUserId = null;
        render();
        break;
      case 'show-manage-filled':
        state.screen = 'main';
        state.activeTab = 'manage';
        state.pendingUsers = pendingUsers.map((item) => ({ ...item }));
        state.acceptedUsers = acceptedUsers.map((item) => ({ ...item }));
        state.swipedUserId = null;
        render();
        break;
      case 'show-home-manage-empty':
        state.screen = 'main';
        state.activeTab = 'manage';
        state.pendingUsers = [];
        state.acceptedUsers = [];
        state.swipedUserId = null;
        state.modal = null;
        render();
        break;
      case 'show-home-qr-detail':
        state.screen = 'qrDetail';
        state.modal = null;
        render();
        break;
      case 'close-home-qr-detail':
        state.screen = 'main';
        state.activeTab = 'share';
        render();
        break;
      case 'show-profile':
        state.screen = 'profile';
        state.receiverPopup = false;
        state.selectedInvitationId = null;
        state.modal = null;
        render();
        break;
      case 'show-invite-popup': {
        const invitation = state.invitations.find((item) => item.status === 'pending');
        state.screen = 'receiverHome';
        state.receiverPopup = Boolean(invitation);
        state.selectedInvitationId = invitation?.id || null;
        state.modal = null;
        render();
        if (!invitation) showToast('No new device sharing request');
        break;
      }
      case 'close-invite-popup':
        state.receiverPopup = false;
        render();
        break;
      case 'popup-accept-invitation': {
        const invitation = state.invitations.find((item) => item.status === 'pending');
        state.receiverPopup = false;
        if (!invitation) {
          render();
          break;
        }
        state.selectedInvitationId = invitation.id;
        runLoading(() => {
          invitation.status = 'accepted';
          state.selectedInvitationId = null;
          state.screen = 'receiverHome';
          render();
          showToast('Device accepted');
        }, 620);
        break;
      }
      case 'popup-refuse-invitation': {
        const invitation = state.invitations.find((item) => item.status === 'pending');
        state.receiverPopup = false;
        if (!invitation) {
          render();
          break;
        }
        runLoading(() => {
          invitation.status = 'pending';
          state.selectedInvitationId = null;
          state.screen = 'receiverHome';
          render();
          showToast('Invitation refused');
        }, 620);
        break;
      }
      case 'show-invitations':
        state.screen = 'invitations';
        state.receiverPopup = false;
        state.selectedInvitationId = null;
        state.modal = null;
        render();
        break;
      case 'open-invitation':
        state.selectedInvitationId = element.dataset.id;
        state.screen = 'invitationDetail';
        render();
        break;
      case 'accept-invitation': {
        const invitation = state.invitations.find((item) => item.id === state.selectedInvitationId);
        if (invitation) invitation.status = 'accepted';
        state.screen = 'invitations';
        render();
        showToast('Device accepted');
        break;
      }
      case 'refuse-invitation':
        {
          const invitation = state.invitations.find((item) => item.id === state.selectedInvitationId);
          if (invitation) invitation.status = 'pending';
        }
        state.selectedInvitationId = null;
        state.screen = 'invitations';
        render();
        showToast('Invitation refused');
        break;
      case 'open-accepted-device': {
        const invitationId = element.dataset.id || state.selectedInvitationId;
        const invitation = state.invitations.find((item) => item.id === invitationId && item.status === 'accepted');
        if (!invitation) {
          showToast('This shared device is unavailable');
          break;
        }
        state.selectedInvitationId = invitation.id;
        state.screen = 'acceptedDevice';
        render();
        break;
      }
      case 'native-back':
        showToast('Return to device settings');
        break;
      case 'open-account-input':
        state.screen = 'account';
        state.modal = null;
        render();
        window.setTimeout(() => document.getElementById('th-account-input')?.focus(), 30);
        break;
      case 'close-account':
        state.screen = 'main';
        state.activeTab = 'share';
        state.inputValue = '';
        render();
        break;
      case 'clear-input':
        state.inputValue = '';
        render();
        window.setTimeout(() => document.getElementById('th-account-input')?.focus(), 20);
        break;
      case 'lookup-user':
        lookupUser();
        break;
      case 'refresh-qr':
        refreshQr();
        break;
      case 'select-contact': {
        if (state.swipedUserId) {
          state.swipedUserId = null;
          render();
          break;
        }
        state.selectedUser = findUser(element.dataset.id);
        state.modal = { type: 'confirm', kind: 'share' };
        render();
        break;
      }
      case 'delete-contact':
        state.selectedUser = findUser(element.dataset.id);
        state.modal = { type: 'confirm', kind: 'deleteRecent' };
        render();
        break;
      case 'manage-user-action':
        state.selectedUser = findUser(element.dataset.id);
        state.modal = { type: 'confirm', kind: element.dataset.kind };
        render();
        break;
      case 'close-modal':
        state.modal = null;
        render();
        break;
      case 'confirm-modal':
        confirmCurrentAction();
        break;
      case 'retry-network':
        state.scenario = 'normal';
        state.modal = null;
        render();
        showToast('Retrying request (Mock)');
        break;
      case 'migration-guide':
        state.modal = null;
        render();
        showToast('Open data storage area guide (Mock)');
        break;
      case 'trigger-home-share-error': {
        const key = document.getElementById('home-error-select')?.value || 'networkToast';
        const toastMessages = {
          networkToast: 'Network exception, please refresh',
          unknownFallback: 'Share failed',
        };
        if (toastMessages[key]) {
          state.modal = null;
          render();
          showToast(toastMessages[key]);
        } else {
          state.modal = {
            type: 'crossRegion',
            errorKey: '10601',
          };
          render();
        }
        break;
      }
      case 'trigger-plus-share-error': {
        const key = document.getElementById('plus-error-select')?.value || 'networkLookup';
        const messages = {
          networkLookup: '无法找到该用户',
          serverExample: '用户已经绑定该分组',
          unknownFallback: '分享失败',
        };
        state.modal = null;
        render();
        showToast(messages[key] || '分享失败');
        break;
      }
      case 'plus-home':
        state.plusScreen = 'home';
        state.plusInputValue = '';
        state.modal = null;
        state.swipedUserId = null;
        render();
        break;
      case 'plus-home-filled':
        state.plusScreen = 'home';
        state.plusScenario = 'normal';
        state.plusContacts = plusContacts.map((item) => ({ ...item }));
        state.plusInputValue = '';
        state.modal = null;
        state.swipedUserId = null;
        render();
        break;
      case 'plus-recent-empty':
        state.plusScreen = 'home';
        state.plusScenario = 'recentEmpty';
        state.plusContacts = [];
        state.plusInputValue = '';
        state.modal = null;
        state.swipedUserId = null;
        render();
        break;
      case 'plus-account':
        state.plusScreen = 'account';
        state.modal = null;
        render();
        window.setTimeout(() => document.getElementById('tp-account-input')?.focus(), 30);
        break;
      case 'plus-qr':
        if (state.plusScenario === 'group') {
          showToast('设备组仅支持手机号/用户ID分享');
          break;
        }
        state.plusScreen = 'qr';
        state.plusQrStatus = 'normal';
        state.plusQrLoading = false;
        state.modal = null;
        render();
        break;
      case 'plus-shared':
        state.plusScreen = 'shared';
        state.modal = null;
        state.swipedUserId = null;
        render();
        break;
      case 'plus-shared-filled':
        state.plusScreen = 'shared';
        state.plusSharedEmpty = false;
        state.plusSharedUsers = plusSharedUsers.map((item) => ({ ...item }));
        state.modal = null;
        state.swipedUserId = null;
        render();
        break;
      case 'plus-shared-empty':
        state.plusScreen = 'shared';
        state.plusSharedEmpty = true;
        state.modal = null;
        state.swipedUserId = null;
        render();
        break;
      case 'plus-remove-shared':
        state.selectedUser = state.plusSharedUsers.find((user) => user.id === element.dataset.id) || null;
        state.modal = { type: 'plusRemove' };
        render();
        break;
      case 'plus-back':
        if (state.plusScreen === 'home') {
          showToast('返回设备设置');
        } else {
          state.plusScreen = 'home';
          state.plusInputValue = '';
          state.modal = null;
          render();
        }
        break;
      case 'plus-clear-input':
        state.plusInputValue = '';
        render();
        window.setTimeout(() => document.getElementById('tp-account-input')?.focus(), 20);
        break;
      case 'plus-lookup-user':
        plusLookupUser();
        break;
      case 'plus-select-contact':
        if (state.swipedUserId) {
          state.swipedUserId = null;
          render();
          break;
        }
        state.selectedUser = findPlusUser(element.dataset.id);
        state.modal = { type: 'plusShare' };
        render();
        break;
      case 'plus-delete-contact':
        state.plusContacts = state.plusContacts.filter((user) => user.id !== element.dataset.id);
        state.swipedUserId = null;
        render();
        showToast('已删除最近分享人');
        break;
      case 'plus-clear-contacts':
        state.modal = { type: 'plusClear' };
        render();
        break;
      case 'plus-close-dialog':
        state.modal = null;
        render();
        break;
      case 'plus-confirm-dialog':
        plusConfirmDialog();
        break;
      case 'plus-refresh-qr':
        plusRefreshQr();
        break;
      case 'plus-save-qr':
        if (state.plusScenario === 'network') {
          state.plusQrStatus = 'failed';
          render();
        } else {
          state.plusQrStatus = 'saved';
          render();
          if (refreshTimer) clearTimeout(refreshTimer);
          refreshTimer = window.setTimeout(() => {
            if (state.plusQrStatus !== 'saved') return;
            state.plusQrStatus = 'normal';
            render();
          }, 1500);
        }
        break;
      case 'reset':
        state.asyncSequence += 1;
        if (refreshTimer) clearTimeout(refreshTimer);
        state = initialState(state.app, state.view);
        render();
        showToast(state.app === 'productB' ? '页面已重置' : 'Prototype reset');
        break;
      default:
        break;
    }
  }

  document.addEventListener('click', (event) => {
    const viewButton = event.target.closest('[data-config="view"]');
    if (viewButton) {
      state.asyncSequence += 1;
      if (refreshTimer) clearTimeout(refreshTimer);
      state.view = viewButton.dataset.value;
      state.modal = null;
      state.loading = null;
      render();
      return;
    }

    const appButton = event.target.closest('[data-config="app"]');
    if (appButton) {
      state.asyncSequence += 1;
      if (refreshTimer) clearTimeout(refreshTimer);
      state = initialState(appButton.dataset.value, 'prototype');
      render();
      return;
    }

    const plusQrStateButton = event.target.closest('[data-config="plus-qr-state"]');
    if (plusQrStateButton) {
      state.asyncSequence += 1;
      if (refreshTimer) clearTimeout(refreshTimer);
      state.plusQrLoading = false;
      state.plusQrStatus = plusQrStateButton.dataset.value;
      state.modal = null;
      state.loading = null;
      render();
      return;
    }

    const plusScenarioButton = event.target.closest('[data-config="plus-scenario"]');
    if (plusScenarioButton) {
      state.asyncSequence += 1;
      if (refreshTimer) clearTimeout(refreshTimer);
      state.plusScenario = plusScenarioButton.dataset.value;
      state.plusScreen = 'home';
      state.plusQrLoading = false;
      state.plusQrStatus = 'normal';
      state.modal = null;
      state.loading = null;
      state.swipedUserId = null;
      if (state.plusScenario === 'recentEmpty') state.plusContacts = [];
      if (state.plusScenario !== 'recentEmpty' && !state.plusContacts.length) {
        state.plusContacts = plusContacts.map((item) => ({ ...item }));
      }
      if (state.plusScenario === 'network') showToast('分享失败');
      render();
      return;
    }

    const scenarioButton = event.target.closest('[data-config="scenario"]');
    if (scenarioButton) {
      state.asyncSequence += 1;
      if (refreshTimer) clearTimeout(refreshTimer);
      state.scenario = scenarioButton.dataset.value;
      state.modal = null;
      state.loading = null;
      if (state.scenario === 'crossRegion' || state.scenario === 'network') {
        state.modal = { type: state.scenario };
      }
      render();
      return;
    }

    const actionElement = event.target.closest('[data-action]');
    if (actionElement) handleAction(actionElement.dataset.action, actionElement);
  });

  document.addEventListener('change', (event) => {
    if (event.target.id === 'home-page-select' || event.target.id === 'plus-page-select') {
      handleAction(event.target.value, event.target);
    }
  });

  document.addEventListener('input', (event) => {
    if (event.target.id === 'th-account-input') {
      state.inputValue = event.target.value;
      const shareButton = document.getElementById('th-share-button');
      if (shareButton) shareButton.disabled = state.inputValue.trim().length === 0;
    }
    if (event.target.id === 'tp-account-input') {
      state.plusInputValue = event.target.value;
      const confirmButton = document.getElementById('tp-confirm-button');
      if (confirmButton) confirmButton.disabled = state.plusInputValue.length === 0;
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && event.target.id === 'th-account-input' && state.inputValue.trim()) lookupUser();
    if (event.key === 'Enter' && event.target.id === 'tp-account-input' && state.plusInputValue) plusLookupUser();
    if (event.key === 'Escape' && state.modal) {
      state.modal = null;
      render();
    }
  });

  document.addEventListener('pointerdown', (event) => {
    const row = event.target.closest('[data-swipe-id]');
    if (!row) return;
    pointerStart = { x: event.clientX, id: row.dataset.swipeId };
  });

  document.addEventListener('pointerup', (event) => {
    if (!pointerStart) return;
    const distance = event.clientX - pointerStart.x;
    if (distance < -38) {
      state.swipedUserId = pointerStart.id;
      render();
    } else if (distance > 38 && state.swipedUserId === pointerStart.id) {
      state.swipedUserId = null;
      render();
    }
    pointerStart = null;
  });

  window.addEventListener('beforeunload', () => {
    clearTimeout(toastTimer);
    if (refreshTimer) clearTimeout(refreshTimer);
  });

  render();
})();

    </script>
  </body>
</html>
